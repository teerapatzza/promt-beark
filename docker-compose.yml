services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - db_data:/app/data
    environment:
      - DB_PATH=/app/data/prompt-berk.db
      - PORT=3000
      # ความลับทั้งหมดมาจากไฟล์ .env ข้างๆ ไฟล์นี้ (ไม่อยู่ใน git)
      # ถ้าไม่มีไฟล์ = ค่าว่าง = M365 ปิดตัวเอง ล็อกอินด้วยรหัสผ่านตามปกติ
      - MS_TENANT_ID=${MS_TENANT_ID:-}
      - MS_CLIENT_ID=${MS_CLIENT_ID:-}
      - MS_CLIENT_SECRET=${MS_CLIENT_SECRET:-}
      - MS_REDIRECT_URI=${MS_REDIRECT_URI:-}
      - LONGDO_API_KEY=${LONGDO_API_KEY:-}

  frontend:
    build:
      context: .
      args:
        APP_ENV: PROD
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=3000

volumes:
  db_data:
