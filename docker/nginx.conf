server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy
    location ~ ^/(auth|users|budget-categories|expenses|expense-log|settings|profiles|places|map-[a-z-]+|stats|backup|health)(/.*)?$ {
        proxy_pass         http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        client_max_body_size 50m;
    }

    # Handle /prompt/* by rewriting to root
    location /prompt/ {
        rewrite ^/prompt/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # ไฟล์ .js/.css ต้องถามเซิร์ฟเวอร์ทุกครั้งก่อนใช้ของเก่า
    # เดิมไม่ได้ตั้งอะไรไว้ เบราว์เซอร์จึงเก็บไว้เองแบบไม่มีกำหนด
    # ผลคือแก้โค้ดแล้ว deploy ไปแต่ผู้ใช้ยังเห็นของเก่า และหาสาเหตุไม่เจอ
    # (เจอจริง: แถบบนสุดยังขึ้นชื่อเก่าทั้งที่ไฟล์บนเซิร์ฟเวอร์แก้แล้ว)
    # no-cache ไม่ได้แปลว่าห้าม cache แต่แปลว่าต้อง revalidate ก่อนใช้
    # ถ้าไฟล์ไม่เปลี่ยน เซิร์ฟเวอร์ตอบ 304 ตัวเล็กๆ ไม่เปลืองแบนด์วิดท์
    location ~* \.(js|css|json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/html;
}
