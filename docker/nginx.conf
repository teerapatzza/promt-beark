# ── สวิตช์ปิดปรับปรุง ────────────────────────────────────────────────
# ปิดแอป  : touch ~/promt-beark/maint/ON      (หรือ ./scripts/maintenance.sh on)
# เปิดแอป : rm    ~/promt-beark/maint/ON      (หรือ ./scripts/maintenance.sh off)
#
# nginx เช็คไฟล์นี้ใหม่ทุกคำขอ จึงสลับได้ทันทีโดยไม่ต้อง reload ไม่ต้อง restart
# และไม่แตะฐานข้อมูลหรือโค้ดเลย
#
# ทำไมถึงวางไว้ในคอนเทนเนอร์ ไม่ใช่ที่ nginx ของโฮสต์:
#   ทางเข้าแอปมีสามทาง — promberk.ha.or.th, IP พอร์ต 80 (ผ่าน motor_pool),
#   และ /prompt บน 443 (ผ่าน hospitalbilling-ssl) — สองทางหลังเป็นไฟล์ของทีมอื่น
#   ปิดที่โฮสต์จึงต้องแก้ config ของคนอื่น และยังปิดไม่สนิทถ้าลืมทางใดทางหนึ่ง
#   แต่ทั้งสามทางวิ่งมาลงที่นี่ทางเดียว ปิดตรงนี้จุดเดียวจึงปิดครบและไม่กระทบใคร
#
# ลิงก์ลับของทีมงานมาจาก MAINT_TOKEN ในไฟล์ .env (ไม่อยู่ใน git เพราะ repo นี้เป็น public)
# ถ้าไม่ได้ตั้งค่า docker-compose จะใส่ค่าที่เดาไม่ได้ให้แทน ไม่มีทางกลายเป็นค่าว่าง
map $cookie_pbdev $pb_bypass {
    default 0;
    "${MAINT_TOKEN}" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── ด่านปิดปรับปรุง ──
    # อยู่ระดับ server จึงครอบทุกเส้นทาง ทั้งหน้าเว็บและ API
    # ลำดับสำคัญ: ตั้งธงก่อน แล้วค่อยยกเว้นทีละกรณี
    set $maint 0;
    if (-f /maint/ON)               { set $maint 1; }
    if ($uri = "/maintenance.html") { set $maint 0; }   # กันวนลูปตอน error_page เด้งเข้ามา
    if ($uri = "/app-logo.png")     { set $maint 0; }   # โลโก้ที่หน้านั้นเรียกใช้
    if ($uri = "/health")           { set $maint 0; }   # ให้ยังเช็คได้ว่าเครื่องเป็นอย่างไร
    if ($uri ~ "^/__maint-bypass/") { set $maint 0; }   # ลิงก์ลับสำหรับรับคุกกี้
    if ($pb_bypass = 1)             { set $maint 0; }   # เครื่องที่รับคุกกี้แล้ว
    if ($maint = 1)                 { return 503; }

    error_page 503 /maintenance.html;

    location = /maintenance.html {
        internal;                                       # เข้าตรงๆ ไม่ได้ ต้องมาจาก error_page
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # ลิงก์ลับ: เปิดครั้งเดียว เบราว์เซอร์จำคุกกี้ไว้ 90 วัน
    # แล้วเข้าใช้งานได้ตามปกติจากที่ไหนก็ได้ ระหว่างที่คนอื่นเห็นหน้าปิดปรับปรุง
    location = /__maint-bypass/${MAINT_TOKEN} {
        add_header Set-Cookie "pbdev=${MAINT_TOKEN}; Path=/; Max-Age=7776000; HttpOnly; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 302 /;
    }

    # ยกเลิกสิทธิ์ของตัวเอง (เช่นอยากลองดูว่าผู้ใช้เห็นอะไร)
    location = /__maint-bypass/off {
        add_header Set-Cookie "pbdev=; Path=/; Max-Age=0" always;
        add_header Cache-Control "no-store" always;
        return 302 /;
    }

    # API proxy
    location ~ ^/(auth|users|budget-categories|expenses|expense-log|settings|profiles|places|map-[a-z-]+|stats|backup|health)(/.*)?$ {
        proxy_pass         http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        client_max_body_size 50m;
    }

    # Handle /prompt/* by rewriting to root
    location /prompt/ {
        rewrite ^/prompt/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # ไฟล์ .js/.css ต้องถามเซิร์ฟเวอร์ทุกครั้งก่อนใช้ของเก่า
    # เดิมไม่ได้ตั้งอะไรไว้ เบราว์เซอร์จึงเก็บไว้เองแบบไม่มีกำหนด
    # ผลคือแก้โค้ดแล้ว deploy ไปแต่ผู้ใช้ยังเห็นของเก่า และหาสาเหตุไม่เจอ
    # (เจอจริง: แถบบนสุดยังขึ้นชื่อเก่าทั้งที่ไฟล์บนเซิร์ฟเวอร์แก้แล้ว)
    # no-cache ไม่ได้แปลว่าห้าม cache แต่แปลว่าต้อง revalidate ก่อนใช้
    # ถ้าไฟล์ไม่เปลี่ยน เซิร์ฟเวอร์ตอบ 304 ตัวเล็กๆ ไม่เปลืองแบนด์วิดท์
    location ~* \.(js|css|json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/html;
}
