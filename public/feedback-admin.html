<!DOCTYPE html>
<html lang="th">
<head>
    <script src="api-fetch.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบประเมินการใช้งาน — ผู้ดูแลระบบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
<style>
:root {
    --navy: #031A52; --navy2: #0B2D7A; --ink: #14213D; --muted: #5A667B;
    --line: #E1E7F2; --bg: #F1F4FA; --gold: #CF952B;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Sarabun', sans-serif; font-size: 16px; }
.hero {
    position: relative; overflow: hidden;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy2) 100%);
    padding: 34px 0 86px;
}
.hero .ring { position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.10); pointer-events: none; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 16px; }
/* ต้องยกขึ้นมาเหนือแถบหัวเรื่อง เพราะหัวเรื่องเป็น position:relative
   ถ้าไม่ยก มันจะวาดทับการ์ดใบแรกที่ถูกดึงขึ้นไปซ้อน */
.body { position: relative; z-index: 1; max-width: 1120px; margin: -56px auto 0; padding: 0 16px 72px; display: flex; flex-direction: column; gap: 18px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 1px 2px rgba(11,35,88,.05), 0 10px 28px rgba(11,35,88,.06); padding: 24px; }
.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 9px; font-family: 'Kanit', sans-serif; border-radius: 14px; transition: transform .15s ease, background .15s ease; }
.btn:focus-visible { outline: 3px solid var(--navy2); outline-offset: 2px; }
.btn:hover { transform: translateY(-1px); }
.btn.gold { background: var(--gold); color: #1B1300; font-size: 15px; font-weight: 600; padding: 12px 22px; box-shadow: 0 6px 14px rgba(207,149,43,.28); }
.btn.navy { background: var(--navy); color: #fff; font-size: 15px; font-weight: 500; padding: 12px 20px; }
.btn.plain { background: #fff; color: var(--navy); font-size: 15px; font-weight: 500; padding: 11px 18px; border: 1.5px solid #D8DEE9; }
.btn.danger { background: #fff; color: #B91C1C; font-size: 14px; font-weight: 500; padding: 9px 14px; border: 1.5px solid #FBC9C9; }
.btn.sm { font-size: 14px; padding: 9px 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
label.f { display: block; font-size: 13.5px; font-weight: 700; color: #475569; margin-bottom: 7px; }
input.f, textarea.f, select.f {
    width: 100%; font-family: 'Sarabun', sans-serif; font-size: 16px; color: var(--ink);
    background: #FBFCFE; border: 1.5px solid #DDE3EE; border-radius: 13px; padding: 12px 15px;
    outline: none; transition: border-color .15s ease, box-shadow .15s ease;
}
input.f:focus, textarea.f:focus, select.f:focus { border-color: var(--navy2); background: #fff; box-shadow: 0 0 0 4px rgba(11,35,88,.10); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; letter-spacing: .03em; padding: 5px 12px; border-radius: 999px; }
.tag.draft  { background: #EEF2FA; color: #51607A; }
.tag.open   { background: #EAF6EF; color: #14663A; }
.tag.closed { background: #FBEFEF; color: #9B3030; }
.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.kpi .box { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
.kpi .n { font-family: 'Kanit', sans-serif; font-size: 30px; font-weight: 600; color: var(--navy); line-height: 1.1; }
.kpi .l { font-size: 14px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; }
.bar { height: 10px; border-radius: 999px; background: #EDF1F8; overflow: hidden; flex-grow: 1; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #2FA35B, #6CC98D); }
.bar.gold > i { background: linear-gradient(90deg, #CF952B, #E8C06B); }
.bar.navy > i { background: linear-gradient(90deg, #0B2D7A, #4C79D4); }
.qcard { border: 1.5px solid var(--line); border-radius: 18px; padding: 18px; background: #fff; }
.qcard.section { background: #FFFBF0; border-color: #F0DEB4; }
.quote { background: #F6F8FC; border-left: 4px solid #9EC5FF; border-radius: 0 12px 12px 0; padding: 12px 16px; font-size: 15px; line-height: 1.75; color: #27344D; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs .t { all: unset; cursor: pointer; font-family: 'Kanit', sans-serif; font-size: 15px; font-weight: 500; padding: 10px 18px; border-radius: 999px; color: #C9D7F2; }
.tabs .t.on { background: #fff; color: var(--navy); font-weight: 600; }
.tabs .t:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.back { display: inline-flex; align-items: center; gap: 8px; color: #B7D3FF; font-size: 15px; font-weight: 600; text-decoration: none; }
.back:hover { color: #fff; }
/* ── สวิตช์เปิด/ปิดรับคำตอบ ──────────────────────────────
   ใช้ checkbox จริงซ่อนไว้ แล้ววาดรางกับหัวทับ คีย์บอร์ดและ screen reader จึงยังใช้ได้ */
.sw, .sw-row { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.sw input, .sw-row input { position: absolute; opacity: 0; width: 0; height: 0; }
.sw-track {
    flex: none; width: 50px; height: 28px; border-radius: 999px; background: #CBD5E1;
    position: relative; transition: background .18s ease;
}
.sw-dot {
    position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(15,23,42,.35); transition: transform .18s ease;
}
.sw input:checked + .sw-track, .sw-row input:checked + .sw-track { background: #2FA35B; }
.sw input:checked + .sw-track .sw-dot, .sw-row input:checked + .sw-track .sw-dot { transform: translateX(22px); }
.sw input:focus-visible + .sw-track, .sw-row input:focus-visible + .sw-track { outline: 3px solid var(--navy2); outline-offset: 3px; }
.sw-lab { font-size: 14px; font-weight: 600; color: var(--muted); }
.sw-row input:checked ~ .sw-lab { color: #14663A; }
.sw-box {
    display: flex; align-items: center; gap: 14px;
    background: #F6F8FC; border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 18px;
}
@media (prefers-reduced-motion: reduce) { .sw-track, .sw-dot { transition: none; } }
.err { background: #FEF2F2; border: 1.5px solid #FCA5A5; color: #991B1B; border-radius: 16px; padding: 14px 18px; font-size: 15px; line-height: 1.7; }
.ok  { background: #EAF6EF; border: 1.5px solid #BFE3CC; color: #14573A; border-radius: 16px; padding: 14px 18px; font-size: 15px; line-height: 1.7; }
@media (max-width: 720px) { .hero { padding: 26px 0 76px; } .card { padding: 18px; border-radius: 18px; } }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
</style>
</head>
<body>

<div class="hero">
    <span class="ring" style="right:-110px; top:-150px; width:430px; height:430px;"></span>
    <span class="ring" style="right:-20px; top:-70px; width:270px; height:270px;"></span>
    <div class="wrap" style="position:relative; display:flex; flex-direction:column; gap:14px;">
        <a class="back" href="index.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 18l-6-6 6-6"></path></svg>
            กลับหน้าแรก
        </a>
        <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;">
            <div style="display:flex; flex-direction:column; gap:6px;">
                <h1 style="margin:0; font-family:'Kanit',sans-serif; font-weight:600; font-size:30px; color:#fff;">แบบประเมินการใช้งาน</h1>
                <p style="margin:0; font-size:15.5px; color:#C9D7F2;">หน้านี้แยกจากหน้าตั้งค่าระบบ ไม่ปนกับหมวดงบประมาณหรือผู้ใช้</p>
            </div>
            <div class="tabs">
                <button type="button" class="t on" id="tabList"  onclick="go('list')">รายการ</button>
                <button type="button" class="t"    id="tabBuild" onclick="go('build')">สร้าง / แก้ไข</button>
                <button type="button" class="t"    id="tabStats" onclick="go('stats')">ผลสรุป</button>
            </div>
        </div>
    </div>
</div>

<div class="body">
    <div id="msg"></div>
    <div id="viewList"></div>
    <div id="viewBuild" style="display:none"></div>
    <div id="viewStats" style="display:none"></div>
</div>

<script>
'use strict';

let FORMS = [];
let EDIT = null;     // ชุดที่กำลังแก้
let VIEW = 'list';

const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const attr = s => esc(s).replace(/'/g, '&#39;');

const KIND_NAME = {
    face: 'สเกลหน้ายิ้ม', star: 'ให้ดาว', scale: 'สเกลตัวเลข',
    choice: 'เลือกตอบ', multi: 'เลือกหลายข้อ', yesno: 'ใช่ / ไม่ใช่',
    text: 'ข้อเสนอแนะ', section: 'หัวข้อคั่นหมวด'
};
const STATUS_NAME = { draft: 'ฉบับร่าง', open: 'เปิดรับอยู่', closed: 'ปิดแล้ว' };
const FACE_LABELS = ['ไม่พอใจมาก', 'ไม่ค่อยพอใจ', 'เฉย ๆ', 'พอใจ', 'พอใจมาก'];

function say(html, kind) {
    document.getElementById('msg').innerHTML = html ? '<div class="' + (kind || 'ok') + '">' + html + '</div>' : '';
    if (html) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function go(v) {
    VIEW = v;
    ['List', 'Build', 'Stats'].forEach(n => {
        document.getElementById('view' + n).style.display = (n.toLowerCase() === v) ? 'block' : 'none';
        document.getElementById('tab' + n).classList.toggle('on', n.toLowerCase() === v);
    });
    if (v === 'list') drawList();
    if (v === 'build') drawBuild();
    if (v === 'stats') drawStats();
}

async function api(method, url, body) {
    const r = await fetch('/feedback' + url, {
        method: method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined
    });
    if (r.status === 401) { location.href = 'login.html'; throw new Error('401'); }
    if (r.status === 403) { throw new Error('หน้านี้สำหรับผู้ดูแลระบบเท่านั้น'); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'ทำรายการไม่สำเร็จ');
    return d;
}

// ══ รายการแบบประเมิน ══════════════════════════════════════

async function loadForms() {
    try { FORMS = await api('GET', '/forms'); }
    catch (e) { say(esc(e.message), 'err'); FORMS = []; }
}

function drawList() {
    const el = document.getElementById('viewList');
    if (!FORMS.length) {
        el.innerHTML = '<div class="card" style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; padding:44px 24px;">'
            + '<span style="width:74px; height:74px; border-radius:50%; background:#FFF4DF; display:flex; align-items:center; justify-content:center;">'
            + '<svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="#B8860B" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="24" cy="24" r="19"></circle><path d="M16 28c2.2 3.4 5 5 8 5s5.8-1.6 8-5"></path><circle cx="18" cy="20" r="2" fill="#B8860B"></circle><circle cx="30" cy="20" r="2" fill="#B8860B"></circle></svg></span>'
            + '<h2 style="margin:0; font-family:\'Kanit\',sans-serif; font-size:22px; font-weight:500;">ยังไม่มีแบบประเมิน</h2>'
            + '<p style="margin:0; color:var(--muted); line-height:1.8;">สร้างชุดแรกเพื่อเริ่มเก็บความเห็นจากผู้ใช้งาน</p>'
            + '<button type="button" class="btn gold" onclick="newForm()">สร้างแบบประเมิน</button></div>';
        return;
    }
    el.innerHTML =
        '<div style="display:flex; justify-content:flex-end; margin-bottom:4px;">'
        + '<button type="button" class="btn gold" onclick="newForm()">'
        + '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>'
        + 'สร้างแบบประเมิน</button></div>'
        + FORMS.map(f => {
            const qn = (f.questions || []).filter(q => q.kind !== 'section').length;
            return '<div class="card" style="display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:14px;">'
                + '<div style="flex:1 1 320px; min-width:0; display:flex; flex-direction:column; gap:8px;">'
                + '<div class="row" style="flex-wrap:wrap; gap:10px;">'
                + '<span class="tag ' + f.status + '">' + STATUS_NAME[f.status] + '</span>'
                + '<h2 style="margin:0; font-family:\'Kanit\',sans-serif; font-size:20px; font-weight:500;">' + esc(f.title) + '</h2></div>'
                + '<span style="font-size:14.5px; color:var(--muted);">' + qn + ' ข้อที่ต้องตอบ · '
                + '<b style="color:var(--navy);">' + f.responses + '</b> คำตอบ'
                + (f.opensAt || f.closesAt ? ' · ' + esc(f.opensAt || '') + ' – ' + esc(f.closesAt || '') : '') + '</span>'
                + '</div>'
                + '<div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">'
                // สวิตช์ในรายการ กดแล้วมีผลทันที ไม่ต้องเข้าไปแก้แล้วบันทึก
                + '<label class="sw-row" title="เปิด/ปิดรับคำตอบ">'
                + '<input type="checkbox"' + (f.status === 'open' ? ' checked' : '')
                + ' onchange="quickToggle(' + f.id + ', this.checked, this)">'
                + '<span class="sw-track"><span class="sw-dot"></span></span>'
                + '<span class="sw-lab">' + (f.status === 'open' ? 'เปิดรับ' : 'ปิดรับ') + '</span></label>'
                + '<button type="button" class="btn plain sm" onclick="editForm(' + f.id + ')">แก้ไข</button>'
                + '<button type="button" class="btn plain sm" onclick="showStats(' + f.id + ')">ผลสรุป</button>'
                + '<button type="button" class="btn danger sm" onclick="removeForm(' + f.id + ')">ลบ</button>'
                + '</div></div>';
        }).join('');
}

/** กดสวิตช์ในหน้ารายการ — บันทึกทันที ส่งค่าเดิมทุกช่องไปด้วยเพื่อไม่ให้วันที่หาย */
async function quickToggle(id, on, el) {
    const f = FORMS.find(x => x.id === id);
    if (!f) return;
    const status = on ? 'open' : 'closed';

    if (on && FORMS.some(x => x.status === 'open' && x.id !== id)) {
        const other = FORMS.find(x => x.status === 'open' && x.id !== id);
        if (!confirm('ตอนนี้ "' + other.title + '" เปิดรับอยู่\n\nเปิดชุดนี้แล้วชุดนั้นจะถูกปิดให้อัตโนมัติ ดำเนินการต่อไหม')) {
            if (el) el.checked = !on;
            return;
        }
    }
    try {
        await api('PUT', '/forms/' + id, { title: f.title, intro: f.intro, status: status,
            opensAt: f.opensAt, closesAt: f.closesAt, questions: f.questions });
        await loadForms(); drawList();
        say(on ? 'เปิดรับคำตอบแล้ว ผู้ใช้เห็นแถบที่หน้าแรกทันที'
               : 'ปิดรับชั่วคราวแล้ว คำตอบเดิมยังอยู่ครบ เปิดใหม่เมื่อไหร่ก็ได้');
    } catch (e) {
        if (el) el.checked = !on;   // คืนสวิตช์กลับ ไม่ให้หน้าจอโกหกว่าสำเร็จ
        say(esc(e.message), 'err');
    }
}

async function removeForm(id) {
    const f = FORMS.find(x => x.id === id);
    if (!f) return;
    if (!confirm('ลบ "' + f.title + '" พร้อมคำตอบทั้ง ' + f.responses + ' ชุด\n\nลบแล้วกู้คืนไม่ได้ ยืนยันไหม')) return;
    try { await api('DELETE', '/forms/' + id); await loadForms(); drawList(); say('ลบเรียบร้อย'); }
    catch (e) { say(esc(e.message), 'err'); }
}

// ══ ตัวสร้างแบบประเมิน ════════════════════════════════════

function blank() {
    return { id: null, title: '', intro: '', status: 'draft', opensAt: '', closesAt: '', questions: [] };
}

/** ข้อความใต้สวิตช์ บอกให้ชัดว่าตอนนี้ผู้ใช้เห็นหรือไม่เห็น */
function activeNote(status) {
    if (status === 'open') return 'ผู้ใช้เห็นแถบชวนให้คะแนนที่หน้าแรก และตอบได้ทันที';
    if (status === 'closed') return 'ปิดรับชั่วคราว ผู้ใช้ไม่เห็นที่หน้าแรก คำตอบเดิมยังอยู่ครบ';
    return 'ยังเป็นฉบับร่าง ผู้ใช้ยังไม่เห็น เปิดสวิตช์เมื่อพร้อมให้ตอบ';
}

/* เปิดได้ทีละชุด ฝั่งเซิร์ฟเวอร์ปิดชุดอื่นให้เองอยู่แล้ว
   ตรงนี้แค่เตือนล่วงหน้าไม่ให้แอดมินเผลอปิดชุดที่กำลังเก็บคำตอบอยู่ */
function onActiveToggle(on) {
    if (on && FORMS.some(x => x.status === 'open' && x.id !== EDIT.id)) {
        const other = FORMS.find(x => x.status === 'open' && x.id !== EDIT.id);
        if (!confirm('ตอนนี้ "' + other.title + '" เปิดรับอยู่\n\nเปิดชุดนี้แล้วชุดนั้นจะถูกปิดให้อัตโนมัติ ดำเนินการต่อไหม')) {
            document.getElementById('bActive').checked = false;
            return;
        }
    }
    EDIT.status = on ? 'open' : (EDIT.id ? 'closed' : 'draft');
    const note = document.getElementById('bActiveNote');
    if (note) note.textContent = activeNote(EDIT.status);
}
function newForm() { EDIT = blank(); go('build'); }
function editForm(id) {
    const f = FORMS.find(x => x.id === id);
    if (!f) return;
    EDIT = JSON.parse(JSON.stringify(f));
    go('build');
}

const NEW_Q = {
    face:    { kind: 'face',    title: 'โดยรวมแล้วพอใจแค่ไหน', required: true },
    star:    { kind: 'star',    title: 'ให้คะแนนความง่าย', max: 5, required: false },
    scale:   { kind: 'scale',   title: 'ให้คะแนน 1 ถึง 10', max: 10, minLabel: 'น้อยที่สุด', maxLabel: 'มากที่สุด', required: false },
    choice:  { kind: 'choice',  title: 'ขั้นตอนไหนที่ยังติดขัด', options: ['ตัวเลือก ก', 'ตัวเลือก ข'], required: false },
    multi:   { kind: 'multi',   title: 'ใช้ฟังก์ชันไหนบ้าง', options: ['ตัวเลือก ก', 'ตัวเลือก ข'], required: false },
    yesno:   { kind: 'yesno',   title: 'จะแนะนำให้เพื่อนร่วมงานใช้ไหม', required: false },
    text:    { kind: 'text',    title: 'อยากบอกอะไรเราเพิ่มไหม', required: false },
    section: { kind: 'section', title: 'หัวข้อใหม่' }
};

function addQ(kind) {
    EDIT.questions.push(JSON.parse(JSON.stringify(NEW_Q[kind])));
    drawBuild();
}
function delQ(i) { EDIT.questions.splice(i, 1); drawBuild(); }
function moveQ(i, d) {
    const j = i + d;
    if (j < 0 || j >= EDIT.questions.length) return;
    const t = EDIT.questions[i]; EDIT.questions[i] = EDIT.questions[j]; EDIT.questions[j] = t;
    drawBuild();
}
function setQ(i, key, value) {
    if (key === 'required') EDIT.questions[i].required = value;
    else if (key === 'max') EDIT.questions[i].max = parseInt(value, 10) || 5;
    else if (key === 'options') EDIT.questions[i].options = value.split('\n').map(s => s.trim()).filter(Boolean);
    else EDIT.questions[i][key] = value;
}

const ICONS = {
    face:   '<circle cx="12" cy="12" r="9"></circle><path d="M8.5 14c1 1.5 2.2 2.2 3.5 2.2s2.5-.7 3.5-2.2"></path><circle cx="9" cy="10" r="1" fill="currentColor"></circle><circle cx="15" cy="10" r="1" fill="currentColor"></circle>',
    star:   '<path d="M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.8-5.2-2.74-5.2 2.74 1-5.8-4.2-4.1 5.8-.85z"></path>',
    scale:  '<path d="M4 18h16"></path><path d="M7 18v-5"></path><path d="M12 18v-9"></path><path d="M17 18v-7"></path>',
    choice: '<circle cx="6" cy="8" r="2.4"></circle><path d="M11 8h8"></path><circle cx="6" cy="16" r="2.4"></circle><path d="M11 16h8"></path>',
    multi:  '<path d="M4 7h4v4H4z"></path><path d="M11 9h9"></path><path d="M4 15h4v4H4z"></path><path d="M11 17h9"></path>',
    yesno:  '<path d="M3.5 12l3 3 6-7"></path><path d="M15.5 9l5 5"></path><path d="M20.5 9l-5 5"></path>',
    text:   '<path d="M4 6h16"></path><path d="M4 11h16"></path><path d="M4 16h9"></path>',
    section:'<path d="M3 12h4"></path><path d="M17 12h4"></path><path d="M9.5 9.5h5v5h-5z"></path>'
};
const icon = k => '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' + ICONS[k] + '</svg>';

function drawBuild() {
    if (!EDIT) EDIT = blank();
    const el = document.getElementById('viewBuild');
    const qn = EDIT.questions.filter(q => q.kind !== 'section').length;

    el.innerHTML =
        '<div class="card" style="display:flex; flex-direction:column; gap:16px;">'
        + '<div class="row" style="justify-content:space-between; flex-wrap:wrap; gap:12px;">'
        + '<h2 style="margin:0; font-family:\'Kanit\',sans-serif; font-size:21px; font-weight:500;">'
        + (EDIT.id ? 'แก้ไขแบบประเมิน' : 'สร้างแบบประเมินใหม่') + '</h2>'
        + '<div style="display:flex; gap:8px; flex-wrap:wrap;">'
        + '<button type="button" class="btn plain sm" onclick="go(\'list\')">ยกเลิก</button>'
        + '<button type="button" class="btn gold" onclick="saveForm()">บันทึก</button></div></div>'
        /* ทุกช่องเขียนลง EDIT ทันทีที่พิมพ์
           15 ต.ค. 2569 — เดิมอ่านค่าจากช่องกรอกเฉพาะตอนกดบันทึก
           พอกดเพิ่มคำถาม drawBuild() วาดช่องใหม่จาก EDIT ที่ยังว่างอยู่
           สิ่งที่พิมพ์ค้างไว้จึงถูกทับหายทั้งสี่ช่อง เจ้าของงานเจอที่ช่องวันที่ */
        + '<div><label class="f" for="bTitle">ชื่อแบบประเมิน</label>'
        + '<input class="f" id="bTitle" value="' + attr(EDIT.title) + '" oninput="EDIT.title=this.value"'
        + ' placeholder="เช่น ความพึงพอใจพร้อมเบิก รอบที่ 1/2570"></div>'
        + '<div><label class="f" for="bIntro">คำชี้แจง (ไม่บังคับ)</label>'
        + '<textarea class="f" id="bIntro" rows="2" oninput="EDIT.intro=this.value"'
        + ' placeholder="ข้อความสั้น ๆ ที่จะขึ้นใต้หัวเรื่อง">' + esc(EDIT.intro) + '</textarea></div>'
        + '<div style="display:flex; gap:14px; flex-wrap:wrap;">'
        + '<div style="flex:1 1 200px;"><label class="f" for="bOpen">เปิดรับตั้งแต่</label>'
        + '<input class="f" type="date" id="bOpen" value="' + attr(EDIT.opensAt || '') + '" oninput="EDIT.opensAt=this.value"></div>'
        + '<div style="flex:1 1 200px;"><label class="f" for="bClose">ปิดรับ</label>'
        + '<input class="f" type="date" id="bClose" value="' + attr(EDIT.closesAt || '') + '" oninput="EDIT.closesAt=this.value"></div></div>'
        + '<p style="margin:0; font-size:13.5px; color:var(--muted); line-height:1.7;">เว้นว่างได้ทั้งคู่ ถ้าเว้นไว้จะเปิดรับจนกว่าจะปิดสวิตช์เอง</p>'

        /* สวิตช์เปิด/ปิดรับคำตอบ — ปิดไว้ชั่วคราวได้โดยไม่ต้องลบชุดทิ้ง
           ช่วงวันที่คุมว่า "เปิดได้ถึงเมื่อไหร่" ส่วนสวิตช์คุมว่า "ตอนนี้เอาไหม" */
        + '<div class="sw-box">'
        + '<label class="sw"><input type="checkbox" id="bActive"' + (EDIT.status === 'open' ? ' checked' : '')
        + ' onchange="onActiveToggle(this.checked)"><span class="sw-track"><span class="sw-dot"></span></span></label>'
        + '<div style="min-width:0; display:flex; flex-direction:column; gap:3px;">'
        + '<b style="font-family:\'Kanit\',sans-serif; font-size:16px; font-weight:500;">เปิดรับคำตอบ</b>'
        + '<span id="bActiveNote" style="font-size:13.5px; color:var(--muted); line-height:1.6;">'
        + activeNote(EDIT.status) + '</span></div></div>'
        + '</div>'

        + '<div style="display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start;">'
        + '<div class="card" style="flex:1 1 260px; min-width:0; display:flex; flex-direction:column; gap:10px;">'
        + '<h3 style="margin:0; font-family:\'Kanit\',sans-serif; font-size:17px; font-weight:500;">เพิ่มคำถาม</h3>'
        + Object.keys(NEW_Q).map(k =>
            '<button type="button" class="btn" onclick="addQ(\'' + k + '\')"'
            + ' style="width:100%; justify-content:flex-start; gap:12px; padding:12px 14px; border:1.5px solid var(--line); background:#FBFCFE; font-family:\'Sarabun\',sans-serif; font-size:15px; font-weight:600; color:#1E293B;">'
            + '<span style="flex:none; width:36px; height:36px; border-radius:11px; background:#EEF3FF; color:#2563EB; display:flex; align-items:center; justify-content:center;">'
            + icon(k) + '</span>' + KIND_NAME[k] + '</button>').join('')
        + '</div>'

        + '<div style="flex:999 1 520px; min-width:0; display:flex; flex-direction:column; gap:12px;">'
        + (EDIT.questions.length
            ? EDIT.questions.map((q, i) => qEditor(q, i)).join('')
            : '<div class="card" style="text-align:center; color:var(--muted); line-height:1.8;">ยังไม่มีคำถาม<br>กดชนิดคำถามทางซ้ายเพื่อเพิ่ม</div>')
        + '<p style="margin:0; font-size:13.5px; color:var(--muted);">' + qn + ' ข้อที่ต้องตอบในแบบประเมินนี้</p>'
        + '</div></div>';
}

function qEditor(q, i) {
    const isSection = q.kind === 'section';
    const num = EDIT.questions.slice(0, i).filter(x => x.kind !== 'section').length + 1;
    let extra = '';

    if (q.kind === 'choice' || q.kind === 'multi') {
        extra = '<div><label class="f">ตัวเลือก (บรรทัดละ 1 ข้อ)</label>'
            + '<textarea class="f" rows="' + Math.max(2, (q.options || []).length) + '"'
            + ' oninput="setQ(' + i + ',\'options\',this.value)">' + esc((q.options || []).join('\n')) + '</textarea></div>';
    } else if (q.kind === 'star' || q.kind === 'scale') {
        extra = '<div style="display:flex; gap:12px; flex-wrap:wrap;">'
            + '<div style="flex:1 1 120px;"><label class="f">จำนวนระดับ</label>'
            + '<input class="f" type="number" min="2" max="10" value="' + (q.max || 5) + '"'
            + ' oninput="setQ(' + i + ',\'max\',this.value)"></div>'
            + (q.kind === 'scale'
                ? '<div style="flex:1 1 140px;"><label class="f">ป้ายฝั่งน้อย</label>'
                  + '<input class="f" value="' + attr(q.minLabel || '') + '" oninput="setQ(' + i + ',\'minLabel\',this.value)"></div>'
                  + '<div style="flex:1 1 140px;"><label class="f">ป้ายฝั่งมาก</label>'
                  + '<input class="f" value="' + attr(q.maxLabel || '') + '" oninput="setQ(' + i + ',\'maxLabel\',this.value)"></div>'
                : '') + '</div>';
    }

    return '<div class="qcard' + (isSection ? ' section' : '') + '">'
        + '<div class="row" style="align-items:flex-start; gap:12px;">'
        + '<span style="flex:none; font-size:13px; font-weight:700; color:#94A3B8; padding-top:12px; min-width:18px;">'
        + (isSection ? '—' : num) + '</span>'
        + '<div style="flex-grow:1; min-width:0; display:flex; flex-direction:column; gap:12px;">'
        + '<div class="row" style="gap:8px; flex-wrap:wrap;">'
        + '<span style="display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:#2563EB; background:#EEF3FF; padding:5px 12px; border-radius:999px;">'
        + icon(q.kind) + KIND_NAME[q.kind] + '</span>'
        + (!isSection
            ? '<label style="display:inline-flex; align-items:center; gap:7px; font-size:14px; color:#475569; cursor:pointer;">'
              + '<input type="checkbox" ' + (q.required ? 'checked' : '') + ' onchange="setQ(' + i + ',\'required\',this.checked)">'
              + 'บังคับตอบ</label>'
            : '')
        + '</div>'
        + '<input class="f" value="' + attr(q.title) + '" placeholder="พิมพ์คำถาม" oninput="setQ(' + i + ',\'title\',this.value)">'
        + (!isSection
            ? '<input class="f" value="' + attr(q.hint || '') + '" placeholder="คำอธิบายใต้คำถาม (ไม่บังคับ)" oninput="setQ(' + i + ',\'hint\',this.value)">'
            : '')
        + extra
        + '</div>'
        + '<div style="flex:none; display:flex; flex-direction:column; gap:6px;">'
        + '<button type="button" class="btn" aria-label="เลื่อนขึ้น" onclick="moveQ(' + i + ',-1)" style="width:32px; height:30px; border:1.5px solid var(--line); color:#64748B;">'
        + '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"></path></svg></button>'
        + '<button type="button" class="btn" aria-label="เลื่อนลง" onclick="moveQ(' + i + ',1)" style="width:32px; height:30px; border:1.5px solid var(--line); color:#64748B;">'
        + '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>'
        + '<button type="button" class="btn" aria-label="ลบคำถามนี้" onclick="delQ(' + i + ')" style="width:32px; height:30px; border:1.5px solid #FBC9C9; color:#C2410C;">'
        + '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg></button>'
        + '</div></div></div>';
}

async function saveForm() {
    // อ่านจากช่องกรอกอีกรอบเผื่อเบราว์เซอร์เติมค่าให้เองโดยไม่ยิง input
    // (ตัวเลือกวันที่บางตัวทำแบบนั้น) ปกติ EDIT ตรงอยู่แล้วจาก oninput
    const grab = (id, key) => { const e = document.getElementById(id); if (e) EDIT[key] = e.value; };
    grab('bTitle', 'title'); grab('bIntro', 'intro');
    grab('bOpen', 'opensAt'); grab('bClose', 'closesAt');

    const body = { title: EDIT.title, intro: EDIT.intro, opensAt: EDIT.opensAt,
                   closesAt: EDIT.closesAt, questions: EDIT.questions, status: EDIT.status };
    try {
        if (EDIT.id) await api('PUT', '/forms/' + EDIT.id, body);
        else {
            const made = await api('POST', '/forms', body);
            // ตอนสร้างใหม่ เซิร์ฟเวอร์ตั้งเป็นฉบับร่างเสมอ
            // ถ้าแอดมินเปิดสวิตช์ไว้ตั้งแต่แรก ต้องสั่งเปิดตามให้ด้วย
            if (EDIT.status === 'open' && made.id)
                await api('PUT', '/forms/' + made.id, Object.assign({}, body, { status: 'open' }));
        }
        await loadForms(); go('list');
        say(EDIT.status === 'open'
            ? 'บันทึกและเปิดรับคำตอบแล้ว ผู้ใช้เห็นที่หน้าแรกทันที'
            : 'บันทึกแล้ว · เปิดสวิตช์ <b>เปิดรับคำตอบ</b> เมื่อพร้อมให้ผู้ใช้ตอบ');
    } catch (e) { say(esc(e.message), 'err'); }
}

// ══ แดชบอร์ดผลสรุป ════════════════════════════════════════

let STATS = null;
let STATS_ID = null;

async function showStats(id) { STATS_ID = id; go('stats'); }

async function drawStats() {
    const el = document.getElementById('viewStats');
    if (!STATS_ID && FORMS.length) STATS_ID = (FORMS.find(f => f.status === 'open') || FORMS[0]).id;
    if (!STATS_ID) { el.innerHTML = '<div class="card" style="text-align:center; color:var(--muted);">ยังไม่มีแบบประเมินให้ดูผล</div>'; return; }

    el.innerHTML = '<div class="card" style="text-align:center; color:var(--muted);">กำลังโหลดผลสรุป…</div>';
    try { STATS = await api('GET', '/forms/' + STATS_ID + '/summary'); }
    catch (e) { el.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; return; }

    const s = STATS;
    const picker = FORMS.length > 1
        ? '<select class="f" style="max-width:360px;" onchange="STATS_ID=parseInt(this.value,10); drawStats()">'
          + FORMS.map(f => '<option value="' + f.id + '"' + (f.id === STATS_ID ? ' selected' : '') + '>'
          + esc(f.title) + ' · ' + STATUS_NAME[f.status] + '</option>').join('') + '</select>'
        : '';

    el.innerHTML =
        '<div class="card" style="display:flex; flex-direction:column; gap:16px;">'
        + '<div class="row" style="justify-content:space-between; flex-wrap:wrap; gap:12px;">'
        + '<div style="display:flex; flex-direction:column; gap:6px; min-width:0;">'
        + '<span class="tag ' + s.form.status + '" style="align-self:flex-start;">' + STATUS_NAME[s.form.status] + '</span>'
        + '<h2 style="margin:0; font-family:\'Kanit\',sans-serif; font-size:22px; font-weight:500;">' + esc(s.form.title) + '</h2></div>'
        + '<div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">' + picker
        + '<a class="btn navy sm" href="/feedback/forms/' + STATS_ID + '/export" style="text-decoration:none;">'
        + '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg>'
        + 'ดาวน์โหลดไฟล์</a></div></div>'

        + '<div class="kpi">'
        + kpi(s.responses, 'ชุดคำตอบที่ได้รับ')
        + kpi(s.people, 'จำนวนผู้ตอบ')
        + kpi(s.rate == null ? '—' : s.rate + '%', 'สัดส่วนจากผู้ใช้ ' + s.staff + ' คน')
        + kpi(overall(s), 'ความพอใจเฉลี่ย')
        + '</div></div>'

        + (s.responses === 0
            ? '<div class="card" style="text-align:center; color:var(--muted); line-height:1.8; padding:40px 24px;">ยังไม่มีใครตอบแบบประเมินชุดนี้<br>เมื่อมีคำตอบเข้ามา ผลสรุปจะขึ้นที่นี่</div>'
            : s.questions.map(q => qStats(q)).join(''));
}

const kpi = (n, l) => '<div class="box"><span class="n">' + esc(String(n)) + '</span><span class="l">' + esc(l) + '</span></div>';

/** ค่าเฉลี่ยรวมจากข้อแบบให้คะแนน แปลงเป็นสเกล 5 ให้เทียบกันได้ */
function overall(s) {
    const rated = s.questions.filter(q => q.average != null && (q.kind === 'face' || q.kind === 'star' || q.kind === 'scale'));
    if (!rated.length) return '—';
    const sum = rated.reduce((a, q) => a + (q.average / (q.max || 5)) * 5, 0);
    return (Math.round((sum / rated.length) * 10) / 10) + ' / 5';
}

function qStats(q) {
    if (q.kind === 'section')
        return '<div class="card section" style="background:#FFFBF0; border-color:#F0DEB4; padding:14px 20px;">'
            + '<b style="font-family:\'Kanit\',sans-serif; font-weight:500; color:#8A5A05;">' + esc(q.title) + '</b></div>';

    let inner = '';
    if (q.distribution && (q.kind === 'face' || q.kind === 'star' || q.kind === 'scale')) {
        const top = Math.max(1, ...q.distribution.map(d => d.count));
        inner = q.distribution.slice().reverse().map(d => {
            const label = q.kind === 'face' ? FACE_LABELS[d.value - 1] : d.value + (q.kind === 'star' ? ' ดาว' : '');
            return '<div class="row" style="gap:12px;">'
                + '<span style="flex:none; width:104px; font-size:14.5px; color:var(--muted); text-align:right;">' + esc(label) + '</span>'
                + '<span class="bar gold"><i style="width:' + Math.round(d.count / top * 100) + '%"></i></span>'
                + '<b style="flex:none; width:38px; font-family:\'Kanit\',sans-serif; font-size:15px;">' + d.count + '</b></div>';
        }).join('');
    } else if (q.distribution) {
        const top = Math.max(1, ...q.distribution.map(d => d.count));
        inner = q.distribution.map(d => {
            const label = q.kind === 'yesno' ? (d.value === 'yes' ? 'ใช่' : 'ไม่ใช่') : d.value;
            return '<div class="row" style="gap:12px;">'
                + '<span style="flex:none; width:140px; font-size:14.5px; color:var(--muted); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + attr(label) + '">' + esc(label) + '</span>'
                + '<span class="bar ' + (q.kind === 'yesno' ? '' : 'navy') + '"><i style="width:' + Math.round(d.count / top * 100) + '%"></i></span>'
                + '<b style="flex:none; width:38px; font-family:\'Kanit\',sans-serif; font-size:15px;">' + d.count + '</b></div>';
        }).join('');
    } else if (q.texts) {
        inner = q.texts.length
            ? q.texts.map(t => '<p class="quote" style="margin:0;">' + esc(t) + '</p>').join('')
            : '<p style="margin:0; color:var(--muted);">ยังไม่มีใครเขียนข้อความ</p>';
    }

    const avg = q.average == null ? ''
        : (q.kind === 'yesno'
            ? '<span class="tag open">ตอบว่าใช่ ' + q.average + '%</span>'
            : '<span class="tag open">เฉลี่ย ' + q.average + ' / ' + (q.max || 5) + '</span>');

    return '<div class="card" style="display:flex; flex-direction:column; gap:16px;">'
        + '<div class="row" style="justify-content:space-between; gap:12px; flex-wrap:wrap;">'
        + '<h3 style="margin:0; font-family:\'Kanit\',sans-serif; font-size:19px; font-weight:500;">' + esc(q.title) + '</h3>'
        + '<div class="row" style="gap:8px;">' + avg
        + '<span style="font-size:14px; color:var(--muted);">' + q.answered + ' คนตอบ</span></div></div>'
        + '<div style="display:flex; flex-direction:column; gap:' + (q.texts ? '10px' : '9px') + ';">' + inner + '</div></div>';
}

(async function start() {
    await loadForms();
    go('list');
})();
