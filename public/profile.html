<!DOCTYPE html>
<html lang="th">
<head>

    <title>จัดการโปรไฟล์ผู้เดินทาง — พร้อมเบิก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Choices.js for searchable dropdown -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script src="thai-address.js"></script>
    <style>
        body { font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans', sans-serif; }

        /* ── dropdown ต้องลอยเหนือทุกอย่างและเลื่อนดูได้เสมอ ──
           Choices.js ตั้ง z-index มาแค่ 1 ส่วนแผนที่ Leaflet ใช้ 200-700
           ถ้าไม่ยกขึ้น รายการจะจมอยู่ใต้แผนที่/หัวเว็บ และเลื่อนไม่ได้ */
        .choices { position: relative; }
        .choices.is-open,
        .choices.is-focused { z-index: 9000; }

        .choices__list--dropdown,
        .choices__list[aria-expanded] {
            z-index: 9001 !important;
            position: absolute;
        }

        /* จำกัดความสูงแล้วให้เลื่อนในตัวเอง ไม่ทะลุจอ */
        .choices__list--dropdown .choices__list,
        .choices__list[aria-expanded] .choices__list {
            max-height: 240px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        /* แผนที่ต้องไม่ดัน z-index ออกมาทับ dropdown */
        #profileMap { z-index: 0; }
        .leaflet-container { z-index: 0; }
        .leaflet-pane,
        .leaflet-top,
        .leaflet-bottom { z-index: 1; }

        /* กล่องที่อยู่ต้องไม่ครอบตัด dropdown ที่ยื่นออกนอกกล่อง */
        #profileForm, #profileForm > div { overflow: visible; }
    </style>
</head>

    <script>
        let map;
        let marker;
        let editingId = null;
        let _allProfiles = [];
        const API = '';
        const LONGDO_API_KEY = '5528d1b402a5fd11be6eec82fd167c4b';

        function initProfileMap() {
            const defaultLoc = [13.7563, 100.5018];
            map = L.map('profileMap').setView(defaultLoc, 10);

            const _streetLayer = L.tileLayer(
                'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                { attribution: '&copy; OpenStreetMap', maxZoom: 19 }
            );
            const _satelliteLayer = L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                { attribution: '&copy; Esri World Imagery', maxZoom: 19 }
            );
            _satelliteLayer.addTo(map);

            const _layerToggle = L.control({ position: 'topright' });
            _layerToggle.onAdd = function() {
                const div = L.DomUtil.create('div', '');
                div.innerHTML = '<button id="profLayerBtn" style="background:white;border:2px solid rgba(0,0,0,0.3);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.2)">🗺️ ถนน</button>';
                L.DomEvent.disableClickPropagation(div);
                div.querySelector('#profLayerBtn').onclick = function() {
                    if (map.hasLayer(_satelliteLayer)) {
                        map.removeLayer(_satelliteLayer); _streetLayer.addTo(map);
                        this.textContent = '🛰️ ดาวเทียม';
                    } else {
                        map.removeLayer(_streetLayer); _satelliteLayer.addTo(map);
                        this.textContent = '🗺️ ถนน';
                    }
                };
                return div;
            };
            _layerToggle.addTo(map);

            marker = L.marker(defaultLoc, { draggable: true }).addTo(map);
            marker.bindTooltip('ลากหมุดไปวางที่บ้าน', { permanent: true, direction: 'top' });
        }

        function buildSmartMapSuggestions(q) {
            const parts = q.trim().split(/\s+/).filter(Boolean);
            if (parts.length <= 1) return [];
            const locPrefixes = ['ตำบล','แขวง','อำเภอ','เขต','จังหวัด','ซอย','ถนน','หมู่บ้าน','หมู่ที่','ต.','อ.','จ.'];
            const suggestions = [];
            const firstLocIdx = parts.findIndex(p => locPrefixes.some(pre => p.startsWith(pre)));
            if (firstLocIdx > 0) suggestions.push(parts.slice(firstLocIdx).join(' '));
            if (parts.length >= 3) {
                const last2 = parts.slice(-2).join(' ');
                if (!suggestions.includes(last2)) suggestions.push(last2);
            }
            const last1 = parts[parts.length - 1];
            if (!suggestions.includes(last1)) suggestions.push(last1);
            return suggestions.filter(s => s !== q).slice(0, 3);
        }

        function renderMapResults(result, input, box, onSelect) {
            box.innerHTML = '';
            if (result.data && result.data.length > 0) {
                result.data.forEach(item => {
                    if (!item.lat || !item.lon) return;
                    const div = document.createElement('div');
                    div.className = 'p-3 hover:bg-blue-50 cursor-pointer border-b border-slate-100 text-sm transition-colors last:border-0';
                    div.innerHTML = `<div class="font-bold text-slate-700">${item.name}</div><div class="text-xs text-slate-400 truncate">${item.address || ''}</div>`;
                    div.onclick = () => {
                        input.value = item.name;
                        box.classList.add('hidden');
                        onSelect(L.latLng(item.lat, item.lon));
                    };
                    box.appendChild(div);
                });
            } else {
                const q = input.value.trim();
                const suggestions = buildSmartMapSuggestions(q);
                box.innerHTML = `<div class="px-4 py-2.5 text-xs text-slate-500 border-b bg-amber-50 border-amber-100">ไม่พบ "<b>${q}</b>" — ลองค้นหาแบบกว้างขึ้น:</div>`;
                if (suggestions.length > 0) {
                    suggestions.forEach(sq => {
                        const sdiv = document.createElement('div');
                        sdiv.className = 'px-4 py-2.5 hover:bg-blue-50 cursor-pointer border-b border-slate-100 text-sm text-blue-600 flex items-center gap-2 transition-colors';
                        sdiv.innerHTML = `<svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>ค้นหา "<b>${sq}</b>"`;
                        sdiv.onclick = () => { input.value = sq; input.dispatchEvent(new Event('input')); };
                        box.appendChild(sdiv);
                    });
                } else {
                    box.innerHTML += `<div class="p-3 text-xs text-slate-400 text-center">ลองพิมพ์ชื่อ ตำบล อำเภอ หรือ จังหวัด แทนครับ</div>`;
                }
            }
        }

        function setupSearch() {
            const input = document.getElementById('mapSearch');
            const box   = document.getElementById('searchSuggestions');
            let timeout;
            input.addEventListener('input', function () {
                clearTimeout(timeout);
                const q = this.value.trim();
                if (q.length < 2) { box.classList.add('hidden'); return; }
                box.classList.remove('hidden');
                box.innerHTML = `<div class="p-3 text-center text-slate-500 text-sm flex items-center justify-center gap-2"><svg class="animate-spin h-4 w-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>กำลังค้นหา...</div>`;
                timeout = setTimeout(async () => {
                    try {
                        const res    = await fetch(`/map-search?q=${encodeURIComponent(q)}`);
                        const result = await res.json();
                        renderMapResults(result, input, box, latlng => {
                            map.flyTo(latlng, 16);
                            marker.setLatLng(latlng);
                            marker.setTooltipContent('📍 ตำแหน่งที่พัก (ลากได้)');
                        });
                    } catch (e) {
                        box.innerHTML = `<div class="p-3 text-center text-rose-500 text-sm">เกิดข้อผิดพลาดในการค้นหา กรุณาลองใหม่</div>`;
                    }
                }, 600);
            });
            document.addEventListener('click', e => {
                if (!input.contains(e.target) && !box.contains(e.target)) box.classList.add('hidden');
            });
        }

        async function renderProfiles() {
            const list = document.getElementById('profileList');
            list.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">กำลังโหลด...</div>`;
            try {
                const res = await fetch('/profiles');
                _allProfiles = await res.json();
                const q = document.getElementById('profileListSearch')?.value || '';
                renderProfileList(q);
            } catch(e) {
                list.innerHTML = `<div class="text-center py-6 text-rose-500 text-sm">โหลดโปรไฟล์ไม่สำเร็จ</div>`;
            }
        }

        function filterProfileList(q) {
            renderProfileList(q);
        }

        function renderProfileList(q) {
            const list = document.getElementById('profileList');
            const lower = (q || '').toLowerCase();
            const profiles = lower
                ? _allProfiles.filter(p =>
                    (p.profileName || '').toLowerCase().includes(lower) ||
                    (p.fullName || '').toLowerCase().includes(lower) ||
                    (p.position || '').toLowerCase().includes(lower))
                : _allProfiles;

            const countEl = document.getElementById('profileCount');
            if (countEl) {
                countEl.textContent = lower
                    ? `พบ ${profiles.length} จาก ${_allProfiles.length} โปรไฟล์`
                    : `ทั้งหมด ${_allProfiles.length} โปรไฟล์`;
            }

            list.innerHTML = '';
            if (!_allProfiles.length) {
                list.innerHTML = `
                    <div class="text-center py-8 text-slate-400">
                        <svg class="w-10 h-10 mx-auto mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <p class="text-sm">ยังไม่มีโปรไฟล์ที่บันทึกไว้</p>
                    </div>`;
                return;
            }
            if (!profiles.length) {
                list.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">ไม่พบโปรไฟล์ที่ตรงกับ "<b>${q}</b>"</div>`;
                return;
            }
            profiles.forEach(p => {
                const initial = (p.profileName || p.fullName || '?').replace(/[^฀-๿a-zA-Z]/g, '').charAt(0) || '?';
                const isEditing = editingId === p.id;
                const div = document.createElement('div');
                div.className = `flex items-center gap-3 border p-3 rounded-xl transition-colors ${isEditing ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-100 hover:bg-blue-50 hover:border-blue-100'}`;
                div.innerHTML = `
                    <div class="w-9 h-9 rounded-full ${isEditing ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'} flex items-center justify-center font-bold text-sm flex-shrink-0">${initial}</div>
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-slate-800 text-sm truncate">${p.profileName}${isEditing ? ' <span class="text-amber-600 font-normal text-xs">(กำลังแก้ไข)</span>' : ''}</div>
                        <div class="text-xs text-slate-500 truncate">${p.fullName}${p.position ? ' · ' + p.position : ''}</div>
                    </div>
                    <div class="flex gap-1 flex-shrink-0">
                        <button title="แก้ไข" class="btn-edit text-slate-300 hover:text-blue-500 transition-colors p-1.5 rounded-lg hover:bg-blue-50">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        </button>
                        <button title="ลบ" class="btn-del text-slate-300 hover:text-rose-500 transition-colors p-1.5 rounded-lg hover:bg-rose-50">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>`;
                // โปรไฟล์ส่วนกลาง: ทุกคนแก้ได้ แต่ "ลบ" สงวนไว้ให้ admin เพราะย้อนกลับไม่ได้
                const isAdmin = window.__currentUser && window.__currentUser.role === 'admin';
                const bEdit = div.querySelector('.btn-edit');
                const bDel  = div.querySelector('.btn-del');

                bEdit.onclick = () => editProfile(p);

                if (p.isGlobal && !isAdmin) {
                    const why = 'โปรไฟล์ส่วนกลาง — ลบได้เฉพาะผู้ดูแลระบบ\n' +
                                '(แก้ไขได้ตามปกติ เพราะการลบย้อนกลับไม่ได้)';
                    bDel.disabled = true;
                    bDel.title = why;
                    bDel.classList.add('opacity-30', 'cursor-not-allowed');
                    bDel.classList.remove('hover:text-rose-500', 'hover:bg-rose-50');
                    bDel.onclick = (e) => { e.stopPropagation(); alert(why); };
                } else {
                    bDel.onclick = () => deleteProfile(p.id);
                }
                list.appendChild(div);
            });
        }

        function editProfile(p) {
            editingId = p.id;
            document.getElementById('pName').value     = p.profileName || '';
            document.getElementById('pUser').value     = p.fullName    || '';
            document.getElementById('pPosition').value = p.position    || '';
            document.getElementById('pAffil').value    = p.affiliation || '';
            document.getElementById('pAddrNo').value   = p.no   || '';
            document.getElementById('pAddrSoi').value  = p.soi  || '';
            document.getElementById('pAddrRoad').value = p.road || '';
            applyAddressToDropdowns(p);
            checkAddressSplit();
            if (p.lat && p.lng) { const ll = L.latLng(p.lat, p.lng); marker.setLatLng(ll); map.flyTo(ll, 15); }
            document.getElementById('formTitle').textContent = 'แก้ไขโปรไฟล์';
            document.getElementById('formIconBg').className  = 'w-7 h-7 bg-amber-500 rounded-lg flex items-center justify-center';
            document.getElementById('formIcon').setAttribute('d', 'M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z');
            document.getElementById('saveBtn').innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>อัปเดตโปรไฟล์`;
            document.getElementById('saveBtn').className = 'flex-1 bg-amber-500 text-white font-bold py-3 rounded-xl hover:bg-amber-600 active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-sm';
            document.getElementById('cancelBtn').classList.remove('hidden');
            document.getElementById('profileForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
            renderProfiles();
        }

        function cancelEdit() {
            editingId = null;
            document.querySelectorAll('#profileForm input[type="text"]').forEach(inp => { inp.value = ''; });
            // ล้าง dropdown ที่อยู่ด้วย ไม่งั้นค่าเดิมค้างไปโปรไฟล์ถัดไป
            document.getElementById('addrFixNotice').classList.add('hidden');
            dismissAddressSplit();
            if (addrChoices.prov) { addrChoices.prov.setChoiceByValue(''); }
            document.getElementById('pAddrProv').value = '';
            onProvinceChange();
            geoPrecision = 'manual'; geoSource = 'none';
            document.getElementById('formTitle').textContent = 'เพิ่มโปรไฟล์ใหม่';
            document.getElementById('formIconBg').className  = 'w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center';
            document.getElementById('formIcon').setAttribute('d', 'M12 4v16m8-8H4');
            document.getElementById('saveBtn').innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>บันทึกโปรไฟล์`;
            document.getElementById('saveBtn').className = 'flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-sm';
            document.getElementById('cancelBtn').classList.add('hidden');
            renderProfiles();
        }

        async function saveProfile() {
            const pName = document.getElementById('pName').value.trim();
            const pUser = document.getElementById('pUser').value.trim();
            if (!pName || !pUser) return alert('กรุณาระบุชื่อโปรไฟล์ และ ชื่อผู้เดินทาง');
            const pos  = marker.getLatLng();
            const addr = currentAddressFromDropdowns();
            const profileData = {
                profileName: pName, fullName: pUser,
                position:    document.getElementById('pPosition').value.trim(),
                affiliation: document.getElementById('pAffil').value.trim(),
                no:   document.getElementById('pAddrNo').value,
                soi:  document.getElementById('pAddrSoi').value,
                road: document.getElementById('pAddrRoad').value,
                // ── ชื่อไทย: รูปแบบเดิม production อ่านได้เหมือนเดิม ──
                sub: addr.sub, dist: addr.dist, prov: addr.prov, zip: addr.zip,
                lat: pos.lat, lng: pos.lng,
                // ── เพิ่มใหม่: รหัสมาตรฐานกรมการปกครอง สำหรับเชื่อม API/ส่งออก ──
                subdistrictCode: addr.subdistrictCode,
                districtCode:    addr.districtCode,
                provinceCode:    addr.provinceCode,
                geo: { lat: pos.lat, lng: pos.lng, precision: geoPrecision, source: geoSource },
                schemaVersion: 2
            };
            try {
                const method = editingId ? 'PUT' : 'POST';
                const url    = editingId ? `/profiles/${editingId}` : '/profiles';
                const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(profileData) });
                if (!res.ok) return alert(await explainError(res, 'บันทึก'));
                // เก็บตำแหน่ง/สังกัดที่พิมพ์ใหม่เข้ารายการกลาง ให้คนถัดไปเลือกได้
                await rememberListValue('positionList',    profileData.position,    knownPositions);
                await rememberListValue('affiliationList', profileData.affiliation, knownAffils);
                fillDatalist('positionOptions', knownPositions);
                fillDatalist('affilOptions', knownAffils);
                cancelEdit();
            } catch (e) {
                alert('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้\n\nสาเหตุ: ' + (e.message || 'ไม่ทราบ') +
                      '\n\nกรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
            }
        }

        /** แปลงคำตอบที่ผิดพลาดจากเซิร์ฟเวอร์ เป็นข้อความที่บอกสาเหตุและทางแก้ */
        async function explainError(res, action) {
            let serverMsg = '';
            try { serverMsg = (await res.json()).error || ''; } catch (_) {}

            const me   = window.__currentUser;
            const role = me ? me.role : '?';

            if (res.status === 403) {
                if (/global/i.test(serverMsg)) {
                    return `${action}ไม่ได้ — โปรไฟล์นี้เป็น "โปรไฟล์ส่วนกลาง"\n\n` +
                           `เหตุผล: โปรไฟล์ส่วนกลางใช้ร่วมกันทั้งองค์กร จึงแก้ไข/ลบได้เฉพาะผู้ดูแลระบบ (admin)\n` +
                           `บัญชีของคุณ: ${me ? me.email : '-'} (สิทธิ์: ${role})\n\n` +
                           `ทางแก้:\n` +
                           `• ขอให้ผู้ดูแลระบบแก้ให้\n` +
                           `• หรือกด "เพิ่มโปรไฟล์ใหม่" เพื่อสร้างโปรไฟล์ส่วนตัวที่คุณแก้เองได้`;
                }
                if (/approver/i.test(serverMsg)) {
                    return `${action}ไม่ได้ — บัญชีสิทธิ์ "ผู้อนุมัติ" แก้ไขโปรไฟล์ไม่ได้\n\n` +
                           `ทางแก้: ขอให้ผู้ดูแลระบบดำเนินการแทน`;
                }
                return `${action}ไม่ได้ — ไม่มีสิทธิ์ในโปรไฟล์นี้\n\n` +
                       `บัญชีของคุณ: ${me ? me.email : '-'} (สิทธิ์: ${role})\n` +
                       `ข้อความจากระบบ: ${serverMsg || '-'}`;
            }
            if (res.status === 404) {
                return `${action}ไม่ได้ — ไม่พบโปรไฟล์นี้แล้ว\n\nอาจมีคนอื่นลบไปก่อนหน้า กรุณารีเฟรชหน้า`;
            }
            if (res.status === 400) {
                return `${action}ไม่ได้ — ข้อมูลไม่ครบหรือไม่ถูกต้อง\n\nข้อความจากระบบ: ${serverMsg || '-'}`;
            }
            if (res.status === 401) {
                return `เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่`;
            }
            return `${action}ไม่สำเร็จ (HTTP ${res.status})\n\nข้อความจากระบบ: ${serverMsg || '-'}`;
        }

        async function deleteProfile(id) {
            if (!confirm('ต้องการลบโปรไฟล์นี้ใช่หรือไม่?')) return;
            try {
                const res = await fetch(`/profiles/${id}`, { method: 'DELETE' });
                if (!res.ok) return alert(await explainError(res, 'ลบ'));
                if (editingId === id) cancelEdit();
                renderProfiles();
            } catch (e) {
                alert('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้\n\nสาเหตุ: ' + (e.message || 'ไม่ทราบ'));
            }
        }

        async function searchFromAddress() {
            const a = currentAddressFromDropdowns();
            if (!a.provinceCode) return alert('กรุณาเลือกจังหวัดก่อน');
            const q = ThaiAddress.geoQuery(a);
            if (!q) return alert('กรุณาเลือกที่อยู่ก่อน');
            const input = document.getElementById('mapSearch');
            const box   = document.getElementById('searchSuggestions');
            input.value = q;
            box.classList.remove('hidden');
            box.innerHTML = `<div class="p-3 text-center text-slate-500 text-sm flex items-center justify-center gap-2"><svg class="animate-spin h-4 w-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>กำลังค้นหาจากที่อยู่...</div>`;
            try {
                const res    = await fetch(`/map-search?q=${encodeURIComponent(q)}`);
                const result = await res.json();
                renderMapResults(result, input, box, latlng => {
                    map.flyTo(latlng, 16);
                    marker.setLatLng(latlng);
                });
                // auto-fly to first result
                if (result.data && result.data[0]?.lat && result.data[0]?.lon) {
                    map.flyTo(L.latLng(result.data[0].lat, result.data[0].lon), 15);
                    marker.setLatLng(L.latLng(result.data[0].lat, result.data[0].lon));
                }
            } catch(e) {
                box.innerHTML = `<div class="p-3 text-center text-rose-500 text-sm">เกิดข้อผิดพลาด</div>`;
            }
        }

        /* ════════════ ที่อยู่แบบ dropdown + รหัสมาตรฐาน + หาพิกัดอัตโนมัติ ════════════ */

        let addrChoices = { prov: null, dist: null, sub: null };
        let geoPrecision = 'manual';   // subdistrict | manual | none
        let geoSource    = 'none';     // osm | longdo | user
        let suppressGeocode = false;   // กันไม่ให้ยิงหาพิกัดตอนกำลังโหลดข้อมูลเดิม

        function setChoices(key, el, placeholder) {
            if (addrChoices[key]) { addrChoices[key].destroy(); addrChoices[key] = null; }
            addrChoices[key] = new Choices(el, {
                searchEnabled: true, shouldSort: false, itemSelectText: '',
                searchPlaceholderValue: placeholder, noResultsText: 'ไม่พบข้อมูล'
            });
        }

        function fillSelect(el, items, placeholder, valueKey, labelKey) {
            el.innerHTML = '';
            const o = document.createElement('option');
            o.value = ''; o.textContent = placeholder;
            el.appendChild(o);
            items.forEach(it => {
                const x = document.createElement('option');
                x.value = it[valueKey]; x.textContent = it[labelKey];
                if (it.zip) x.dataset.zip = it.zip;
                el.appendChild(x);
            });
        }

        /** เปลี่ยนคำเรียกหน่วยการปกครองตามจังหวัด (กรุงเทพ = เขต/แขวง) */
        function updateAddrLabels(provinceCode) {
            const L = provinceCode ? ThaiAddress.labels(provinceCode) : { district: 'อำเภอ', subdistrict: 'ตำบล' };
            document.getElementById('pAddrDistLabel').textContent = L.district;
            document.getElementById('pAddrSubLabel').textContent  = L.subdistrict;
            return L;
        }

        function onProvinceChange() {
            const pc = document.getElementById('pAddrProv').value;
            const L  = updateAddrLabels(pc);
            const dEl = document.getElementById('pAddrDist');
            const sEl = document.getElementById('pAddrSub');

            fillSelect(dEl, pc ? ThaiAddress.districts(pc) : [], pc ? '— เลือก' + L.district + ' —' : '— เลือกจังหวัดก่อน —', 'code', 'name');
            dEl.disabled = !pc;
            setChoices('dist', dEl, 'ค้นหา' + L.district + '...');

            fillSelect(sEl, [], '— เลือก' + L.district + 'ก่อน —', 'code', 'name');
            sEl.disabled = true;
            setChoices('sub', sEl, 'ค้นหา' + L.subdistrict + '...');

            document.getElementById('pAddrZip').value = '';
            dEl.addEventListener('change', onDistrictChange);
        }

        function onDistrictChange() {
            const pc = document.getElementById('pAddrProv').value;
            const dc = document.getElementById('pAddrDist').value;
            const L  = ThaiAddress.labels(pc);
            const sEl = document.getElementById('pAddrSub');

            fillSelect(sEl, dc ? ThaiAddress.subdistricts(dc) : [], dc ? '— เลือก' + L.subdistrict + ' —' : '— เลือก' + L.district + 'ก่อน —', 'code', 'name');
            sEl.disabled = !dc;
            setChoices('sub', sEl, 'ค้นหา' + L.subdistrict + '...');
            document.getElementById('pAddrZip').value = '';
            sEl.addEventListener('change', onSubdistrictChange);
        }

        function onSubdistrictChange() {
            const sc = document.getElementById('pAddrSub').value;
            document.getElementById('pAddrZip').value = sc ? ThaiAddress.zipOf(sc) : '';
            if (sc && !suppressGeocode) geocodeCurrentAddress();
        }

        /** อ่านค่าที่เลือกอยู่ คืนทั้งชื่อไทยและรหัส */
        function currentAddressFromDropdowns() {
            const pEl = document.getElementById('pAddrProv');
            const dEl = document.getElementById('pAddrDist');
            const sEl = document.getElementById('pAddrSub');
            const txt = el => (el.selectedIndex > 0 ? el.options[el.selectedIndex].textContent.trim() : '');
            return {
                prov: txt(pEl), dist: txt(dEl), sub: txt(sEl),
                zip: document.getElementById('pAddrZip').value.trim(),
                provinceCode:    pEl.value || null,
                districtCode:    dEl.value || null,
                subdistrictCode: sEl.value || null
            };
        }

        /** โหลดที่อยู่เดิมเข้า dropdown — แปลงชื่อเก่าเป็นชื่อทางการให้อัตโนมัติ */
        function applyAddressToDropdowns(p) {
            const notice = document.getElementById('addrFixNotice');
            notice.classList.add('hidden');
            notice.innerHTML = '';
            if (!ThaiAddress.ready()) return;

            suppressGeocode = true;
            const n = ThaiAddress.normalize({ prov: p.prov, dist: p.dist, sub: p.sub, zip: p.zip });

            document.getElementById('pAddrProv').value = n.provinceCode || '';
            setChoices('prov', document.getElementById('pAddrProv'), 'ค้นหาจังหวัด...');
            onProvinceChange();
            if (n.provinceCode) addrChoices.prov.setChoiceByValue(n.provinceCode);

            if (n.districtCode) {
                document.getElementById('pAddrDist').value = n.districtCode;
                addrChoices.dist.setChoiceByValue(n.districtCode);
                onDistrictChange();
                if (n.subdistrictCode) {
                    document.getElementById('pAddrSub').value = n.subdistrictCode;
                    addrChoices.sub.setChoiceByValue(n.subdistrictCode);
                }
            }
            document.getElementById('pAddrZip').value = n.zip || '';
            suppressGeocode = false;

            // แจ้งว่าระบบแก้อะไรให้ / อะไรที่ยังต้องเลือกเอง
            const msg = [];
            n.changes.forEach(c => {
                const label = { prov: 'จังหวัด', dist: 'อำเภอ/เขต', sub: 'ตำบล/แขวง', zip: 'รหัสไปรษณีย์' }[c.field] || c.field;
                msg.push('• <b>' + label + '</b> ปรับจาก “' + (c.from || '(ว่าง)') + '” เป็น “<b>' + c.to + '</b>” — ' + c.reason);
            });
            if (n.unresolved.length) {
                const label = { prov: 'จังหวัด', dist: 'อำเภอ/เขต', sub: 'ตำบล/แขวง' };
                const names = n.unresolved.map(f => label[f] || f).join(', ');
                let extra = '';
                if (n.subChoices) extra = ' (ตัวเลือก: ' + n.subChoices.join(' / ') + ')';
                msg.push('• ⚠️ <b>' + names + '</b> เดิมคือ “' + (p[n.unresolved[0]] || '') + '” จับคู่กับข้อมูลทางการไม่ได้ <b>กรุณาเลือกเอง</b>' + extra);
            }
            if (msg.length) {
                notice.innerHTML = '<div class="font-bold mb-1">ระบบปรับข้อมูลที่อยู่ให้ตรงกับทะเบียนราชการ</div>' + msg.join('<br>');
                notice.classList.remove('hidden');
            }
        }

        /* ── เสนอแยก ซอย/ถนน ที่ปนอยู่ในช่องเลขที่ (ต้องกดยืนยัน ไม่แยกเงียบๆ) ── */

        let pendingSplit = null;

        function checkAddressSplit() {
            const box = document.getElementById('addrSplitSuggest');
            box.classList.add('hidden'); box.innerHTML = '';
            pendingSplit = null;

            const no   = document.getElementById('pAddrNo').value.trim();
            const soi  = document.getElementById('pAddrSoi').value.trim();
            const road = document.getElementById('pAddrRoad').value.trim();
            if (soi || road) return;              // มีข้อมูลอยู่แล้ว ไม่ยุ่ง

            const r = ThaiAddress.splitAddressLine(no);
            if (!r) return;

            pendingSplit = r;
            const cell = (label, v) =>
                `<div><span class="text-slate-500">${label}</span><br><b>${v ? esc(v) : '—'}</b></div>`;
            box.innerHTML = `
                <div class="font-bold text-sky-800 mb-2">💡 ระบบพบว่าช่อง "เลขที่" มีซอย/ถนนปนอยู่ — แยกให้ไหม?</div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3 text-sky-900">
                    ${cell('เลขที่', r.no)}${cell('ซอย', r.soi)}${cell('ถนน', r.road)}
                </div>
                <div class="flex flex-wrap gap-2">
                    <button type="button" onclick="applyAddressSplit()"
                        class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-3 py-1.5 rounded-lg">แยกตามนี้</button>
                    <button type="button" onclick="dismissAddressSplit()"
                        class="border border-slate-300 hover:bg-slate-50 px-3 py-1.5 rounded-lg">ไม่ต้อง</button>
                </div>`;
            box.classList.remove('hidden');
        }

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function applyAddressSplit() {
            if (!pendingSplit) return;
            document.getElementById('pAddrNo').value   = pendingSplit.no;
            document.getElementById('pAddrSoi').value  = pendingSplit.soi;
            document.getElementById('pAddrRoad').value = pendingSplit.road;
            dismissAddressSplit();
        }

        function dismissAddressSplit() {
            pendingSplit = null;
            const box = document.getElementById('addrSplitSuggest');
            box.classList.add('hidden'); box.innerHTML = '';
        }

        /**
         * หาพิกัดแบบไล่ลำดับ — ละเอียดที่สุดก่อน ถ้าไม่เจอค่อยถอยลงมา
         * วัดกับพิกัดจริงแล้ว: ระดับซอย ≈ 0.5 กม. / ระดับตำบล ≈ 1.5-3 กม.
         */
        const GEO_LEVELS = [
            { key: 'soi',         label: 'ระดับซอย',   zoom: 16, accuracy: '±500 ม.' },
            { key: 'road',        label: 'ระดับถนน',   zoom: 15, accuracy: '±500 ม.' },
            { key: 'subdistrict', label: 'ระดับตำบล',  zoom: 14, accuracy: '±1-3 กม.' },
            { key: 'district',    label: 'ระดับอำเภอ', zoom: 12, accuracy: '±5 กม.' }
        ];

        function buildGeoQueries(a) {
            const Lb   = ThaiAddress.labels(a.provinceCode);
            const tail = [a.sub ? Lb.subdistrict + a.sub : '', a.dist ? Lb.district + a.dist : '', a.prov]
                            .filter(Boolean).join(' ');
            const soi  = document.getElementById('pAddrSoi').value.trim();
            const road = document.getElementById('pAddrRoad').value.trim();
            return [
                { key: 'soi',         q: soi  ? soi  + ' ' + tail : '' },
                { key: 'road',        q: road ? road + ' ' + tail : '' },
                { key: 'subdistrict', q: tail },
                { key: 'district',    q: [a.dist ? Lb.district + a.dist : '', a.prov].filter(Boolean).join(' ') }
            ];
        }

        async function geocodeCurrentAddress() {
            const a = currentAddressFromDropdowns();
            if (!a.provinceCode) return;

            for (const cand of buildGeoQueries(a)) {
                if (!cand.q) continue;
                let hit = null;
                try {
                    const res = await fetch(`/map-search?q=${encodeURIComponent(cand.q)}`);
                    hit = ((await res.json()).data || [])[0];
                } catch (e) { continue; }
                if (!hit || !hit.lat || !hit.lon) continue;

                const lv = GEO_LEVELS.find(x => x.key === cand.key);
                const ll = L.latLng(parseFloat(hit.lat), parseFloat(hit.lon));
                marker.setLatLng(ll);
                map.flyTo(ll, lv.zoom);
                geoPrecision = cand.key;
                geoSource    = 'auto';
                marker.setTooltipContent('📍 ' + lv.label + ' ' + lv.accuracy + ' — ลากปรับให้ตรงบ้านได้');
                marker.openTooltip();
                showGeoBadge(lv, false);
                return;
            }
            showGeoBadge(null, false);
        }

        /** ป้ายบอกความแม่นยำ ให้ผู้ใช้และผู้อนุมัติเห็นชัดว่าพิกัดนี้เชื่อได้แค่ไหน */
        function showGeoBadge(lv, confirmed) {
            let el = document.getElementById('geoBadge');
            if (!el) {
                el = document.createElement('div');
                el.id = 'geoBadge';
                el.className = 'mt-2 text-xs';
                document.getElementById('profileMap').insertAdjacentElement('afterend', el);
            }
            if (confirmed) {
                el.innerHTML = '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold">✓ ตำแหน่งยืนยันเอง — แม่นยำที่สุด</span>';
            } else if (lv) {
                const warn = (lv.key === 'subdistrict' || lv.key === 'district');
                el.innerHTML = '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg ' +
                    (warn ? 'bg-amber-50 border border-amber-200 text-amber-800' : 'bg-sky-50 border border-sky-200 text-sky-800') +
                    ' font-bold">📍 ระบบหาให้ ' + lv.label + ' ' + lv.accuracy + '</span>' +
                    (warn ? '<span class="text-slate-500 ml-2">แนะนำให้ลากหมุดไปที่บ้านจริงเพื่อความแม่นยำ</span>' : '');
            } else {
                el.innerHTML = '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-rose-50 border border-rose-200 text-rose-800 font-bold">⚠️ หาพิกัดอัตโนมัติไม่ได้ — กรุณาลากหมุดเอง</span>';
            }
        }

        /* ── ตำแหน่ง / สังกัด: เลือกจากรายการหรือพิมพ์เองก็ได้ ──
           ใช้ combobox ที่เขียนเอง พิมพ์ไปกรองไป และเพิ่มค่าใหม่ได้จากในรายการเลย
           ค่าที่พิมพ์ใหม่จะถูกส่งเข้ารายการกลางตอนบันทึก ให้คนถัดไปเลือกได้ทันที */

        // เปลี่ยนจาก <datalist> ของเบราว์เซอร์มาเป็น combobox ที่เราคุมหน้าตาเองได้
        // ชื่อฟังก์ชันคงเดิม จุดที่เรียกใช้ทั่วหน้าจึงไม่ต้องแก้
        const CB_FOR = { positionOptions: 'pPosition', affilOptions: 'pAffil' };
        const _cb = {};
        function fillDatalist(id, items) {
            const inputId = CB_FOR[id];
            if (!inputId || !window.Combobox) return;
            if (!_cb[id]) {
                const isPos = id === 'positionOptions';
                _cb[id] = Combobox.attach(inputId, {
                    addLabel: isPos ? 'ตำแหน่ง' : 'ส่วนงาน',
                    // เพิ่มปุ๊บเก็บขึ้นเซิร์ฟเวอร์ปั๊บ ไม่ต้องรอกดบันทึกโปรไฟล์
                    onCreate: (v) => rememberListValue(
                        isPos ? 'positionList' : 'affiliationList',
                        v,
                        isPos ? knownPositions : knownAffils
                    )
                });
            }
            if (_cb[id]) _cb[id].setItems(items || []);
        }

        let knownPositions = [], knownAffils = [];

        async function loadAffiliations() {
            try {
                const res = await fetch('/settings');
                if (!res.ok) return;
                const s = await res.json();
                knownAffils = s.affiliationList || [];
                fillDatalist('affilOptions', knownAffils);
            } catch (e) { console.warn('โหลดสังกัดไม่สำเร็จ', e); }
        }

        /** ถ้าผู้ใช้พิมพ์ค่าใหม่ที่ยังไม่มีในรายการ ให้เก็บเข้ารายการกลาง */
        async function rememberListValue(key, value, known) {
            const v = (value || '').trim().replace(/\s+/g, ' ');
            if (!v) return;
            if (known.some(x => String(x).trim() === v)) return;   // มีอยู่แล้ว
            try {
                const r = await fetch('/settings/list-append', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key, value: v })
                });
                if (r.ok) known.push(v);
            } catch (e) { /* เก็บไม่ได้ก็ไม่เป็นไร ค่ายังบันทึกในโปรไฟล์ปกติ */ }
        }

        async function initAddressDropdowns() {
            await ThaiAddress.load('data/thailand-address.json');
            const pEl = document.getElementById('pAddrProv');
            fillSelect(pEl, ThaiAddress.provinces(), '— เลือกจังหวัด —', 'code', 'name');
            setChoices('prov', pEl, 'ค้นหาจังหวัด...');
            pEl.addEventListener('change', onProvinceChange);
            onProvinceChange();
        }

        async function loadPositions() {
            try {
                const res = await fetch('/settings');
                if (!res.ok) return;
                const settings = await res.json();
                knownPositions = settings.positionList || [];
                fillDatalist('positionOptions', knownPositions);
            } catch (err) {
                console.warn('โหลดตำแหน่งไม่สำเร็จ:', err);
            }
        }

        initProfileMap();
        setupSearch();
        loadPositions();
        loadAffiliations();
        initAddressDropdowns().catch(e => {
            console.error(e);
            alert('โหลดข้อมูลจังหวัด/อำเภอ/ตำบลไม่สำเร็จ — ช่องที่อยู่จะใช้งานไม่ได้\n' + e.message);
        });
        // renderProfiles ต้องรอให้รู้ก่อนว่าใครล็อกอิน ไม่งั้นจะล็อกปุ่มของ admin ผิด
        // (เรียกจากท้ายไฟล์หลัง initAuthGuard สำเร็จ)

        // ลากหมุดเอง = ยืนยันตำแหน่งแม่นยำ บันทึกว่ามาจากคน ไม่ใช่ระบบเดา
        marker.on('dragend', () => {
            geoPrecision = 'exact';
            geoSource    = 'user';
            marker.setTooltipContent('📍 ตำแหน่งที่ยืนยันเอง');
            showGeoBadge(null, true);
        });
    </script>
    <script src="auth-guard.js"></script>
    <script>
        // รอให้ยืนยันตัวตนเสร็จก่อน แล้วค่อยวาดรายชื่อ
        // เพราะการล็อกปุ่มแก้ไข/ลบ ต้องรู้ว่าผู้ใช้เป็น admin หรือไม่
        initAuthGuard()
            .then(() => renderProfiles())
            .catch(() => { /* auth-guard พาไปหน้า login เองแล้ว */ });
    </script>
</body>
</html>
