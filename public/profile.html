<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการโปรไฟล์ผู้เดินทาง — Prompt-Berk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Sticky header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center gap-3">
            <a href="index.html" class="text-slate-400 hover:text-slate-700 transition-colors p-1 -m-1 rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
            </a>
            <div class="h-5 w-px bg-slate-200"></div>
            <div>
                <h1 class="text-base font-bold text-slate-800 leading-none">จัดการโปรไฟล์ผู้เดินทาง</h1>
                <p class="text-xs text-slate-400 mt-0.5">บันทึกข้อมูลส่วนตัวเพื่อความรวดเร็วในการกรอกแบบฟอร์ม</p>
            </div>
        </div>
    </header>

    <div class="max-w-5xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Form -->
            <div id="profileForm" class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 shadow-sm p-6">

                <div class="flex items-center gap-2 mb-5 pb-4 border-b border-slate-100">
                    <div id="formIconBg" class="w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path id="formIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                    </div>
                    <h2 id="formTitle" class="text-base font-bold text-slate-700">เพิ่มโปรไฟล์ใหม่</h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div class="col-span-full">
                        <label class="block text-xs font-bold text-slate-500 mb-1.5">ชื่อโปรไฟล์ <span class="text-rose-500">*</span> <span class="font-normal text-slate-400">(เช่น บ้านนนทบุรี, คอนโด)</span></label>
                        <input type="text" id="pName" placeholder="ตั้งชื่อโปรไฟล์ให้จำง่าย..."
                            class="w-full border border-slate-200 p-3 rounded-xl text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition bg-blue-50 font-bold text-blue-800 placeholder-blue-300">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5">ชื่อ-นามสกุล ผู้เดินทาง <span class="text-rose-500">*</span></label>
                        <input type="text" id="pUser" placeholder="ระบุชื่อ-นามสกุล..."
                            class="w-full border border-slate-200 p-3 rounded-xl text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5">ตำแหน่ง</label>
                        <input type="text" id="pPosition" placeholder="เช่น นักวิเคราะห์นโยบายและแผน..."
                            class="w-full border border-slate-200 p-3 rounded-xl text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition">
                    </div>
                    <div class="col-span-full md:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 mb-1.5">สังกัด / กลุ่มงาน</label>
                        <input type="text" id="pAffil" placeholder="ระบุสังกัด..."
                            class="w-full border border-slate-200 p-3 rounded-xl text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition">
                    </div>
                </div>

                <!-- Address -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-4">
                    <div class="flex items-center gap-2 mb-3">
                        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                        </svg>
                        <label class="text-xs font-bold text-slate-700">ข้อมูลที่อยู่</label>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <input type="text" id="pAddrNo"   placeholder="เลขที่"        class="border border-slate-200 p-2.5 rounded-lg text-sm outline-none focus:border-blue-400 transition bg-white">
                        <input type="text" id="pAddrSoi"  placeholder="ซอย"           class="border border-slate-200 p-2.5 rounded-lg text-sm outline-none focus:border-blue-400 transition bg-white">
                        <input type="text" id="pAddrRoad" placeholder="ถนน"           class="border border-slate-200 p-2.5 rounded-lg text-sm outline-none focus:border-blue-400 transition bg-white">
                        <input type="text" id="pAddrSub"  placeholder="ตำบล/แขวง"    class="border border-slate-200 p-2.5 rounded-lg text-sm outline-none focus:border-blue-400 transition bg-white">
                        <input type="text" id="pAddrDist" placeholder="อำเภอ/เขต"    class="border border-slate-200 p-2.5 rounded-lg text-sm outline-none focus:border-blue-400 transition bg-white">
                        <input type="text" id="pAddrProv" placeholder="จังหวัด"       class="border border-slate-200 p-2.5 rounded-lg text-sm outline-none focus:border-blue-400 transition bg-white">
                        <input type="text" id="pAddrZip"  placeholder="รหัสไปรษณีย์" class="border border-slate-200 p-2.5 rounded-lg text-sm outline-none focus:border-blue-400 transition bg-white">
                    </div>
                </div>

                <!-- Map -->
                <div class="mb-5">
                    <div class="flex items-center gap-2 mb-2">
                        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <label class="text-xs font-bold text-slate-700">ปักหมุดตำแหน่งที่พัก</label>
                        <span class="text-xs text-slate-400">(ค้นหาหรือเลื่อนหมุดบนแผนที่)</span>
                    </div>
                    <div class="flex gap-2 mb-2">
                        <div class="relative flex-1">
                            <input type="text" id="mapSearch" autocomplete="off" placeholder="พิมพ์ชื่อสถานที่เพื่อค้นหาพิกัด..."
                                class="w-full border border-slate-200 p-3 rounded-xl text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition shadow-sm">
                            <div id="searchSuggestions" class="absolute z-[9999] w-full bg-white border border-slate-200 shadow-xl rounded-xl hidden max-h-60 overflow-y-auto mt-1"></div>
                        </div>
                        <button onclick="searchFromAddress()" title="ค้นหาจากที่อยู่ด้านบน"
                            class="bg-slate-100 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 text-slate-600 hover:text-blue-600 px-3 rounded-xl transition-colors flex-shrink-0 flex items-center gap-1.5 text-xs font-bold">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            ค้นหาจากที่อยู่
                        </button>
                    </div>
                    <div id="profileMap" class="w-full h-64 rounded-xl border border-slate-200 shadow-inner"></div>
                </div>

                <div class="flex gap-3">
                    <button id="cancelBtn" onclick="cancelEdit()" class="hidden flex-1 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl hover:bg-slate-200 active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                        ยกเลิก
                    </button>
                    <button id="saveBtn" onclick="saveProfile()"
                        class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
                        </svg>
                        บันทึกโปรไฟล์
                    </button>
                </div>
            </div>

            <!-- Saved profiles -->
            <div class="lg:col-span-1 bg-white rounded-2xl border border-slate-200 shadow-sm p-6 h-fit sticky top-20">
                <div class="flex items-center gap-2 mb-3 pb-3 border-b border-slate-100">
                    <div class="w-7 h-7 bg-slate-100 rounded-lg flex items-center justify-center flex-shrink-0">
                        <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h2 class="text-base font-bold text-slate-700 leading-none">โปรไฟล์ที่บันทึกไว้</h2>
                        <p id="profileCount" class="text-xs text-slate-400 mt-0.5"></p>
                    </div>
                </div>
                <!-- Search -->
                <div class="relative mb-3">
                    <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </span>
                    <input type="text" id="profileListSearch" placeholder="ค้นหาโปรไฟล์..."
                        class="w-full border border-slate-200 pl-8 pr-3 py-2 rounded-lg text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition"
                        oninput="filterProfileList(this.value)">
                </div>
                <div id="profileList" class="space-y-2 max-h-[60vh] overflow-y-auto pr-0.5"></div>
            </div>

        </div>
    </div>

    <script>
        let map;
        let marker;
        let editingId = null;
        let _allProfiles = [];
        const API = '';
        const LONGDO_API_KEY = '5528d1b402a5fd11be6eec82fd167c4b';

        function initProfileMap() {
            const defaultLoc = [13.7563, 100.5018];
            map = L.map('profileMap').setView(defaultLoc, 10);
            L.tileLayer(
                'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom: 19 }
            ).addTo(map);
            marker = L.marker(defaultLoc, { draggable: true }).addTo(map);
            marker.bindTooltip('ลากหมุดไปวางที่บ้าน', { permanent: true, direction: 'top' });
        }

        function buildSmartMapSuggestions(q) {
            const parts = q.trim().split(/\s+/).filter(Boolean);
            if (parts.length <= 1) return [];
            const locPrefixes = ['ตำบล','แขวง','อำเภอ','เขต','จังหวัด','ซอย','ถนน','หมู่บ้าน','หมู่ที่','ต.','อ.','จ.'];
            const suggestions = [];
            const firstLocIdx = parts.findIndex(p => locPrefixes.some(pre => p.startsWith(pre)));
            if (firstLocIdx > 0) suggestions.push(parts.slice(firstLocIdx).join(' '));
            if (parts.length >= 3) {
                const last2 = parts.slice(-2).join(' ');
                if (!suggestions.includes(last2)) suggestions.push(last2);
            }
            const last1 = parts[parts.length - 1];
            if (!suggestions.includes(last1)) suggestions.push(last1);
            return suggestions.filter(s => s !== q).slice(0, 3);
        }

        function renderMapResults(result, input, box, onSelect) {
            box.innerHTML = '';
            if (result.data && result.data.length > 0) {
                result.data.forEach(item => {
                    if (!item.lat || !item.lon) return;
                    const div = document.createElement('div');
                    div.className = 'p-3 hover:bg-blue-50 cursor-pointer border-b border-slate-100 text-sm transition-colors last:border-0';
                    div.innerHTML = `<div class="font-bold text-slate-700">${item.name}</div><div class="text-xs text-slate-400 truncate">${item.address || ''}</div>`;
                    div.onclick = () => {
                        input.value = item.name;
                        box.classList.add('hidden');
                        onSelect(L.latLng(item.lat, item.lon));
                    };
                    box.appendChild(div);
                });
            } else {
                const q = input.value.trim();
                const suggestions = buildSmartMapSuggestions(q);
                box.innerHTML = `<div class="px-4 py-2.5 text-xs text-slate-500 border-b bg-amber-50 border-amber-100">ไม่พบ "<b>${q}</b>" — ลองค้นหาแบบกว้างขึ้น:</div>`;
                if (suggestions.length > 0) {
                    suggestions.forEach(sq => {
                        const sdiv = document.createElement('div');
                        sdiv.className = 'px-4 py-2.5 hover:bg-blue-50 cursor-pointer border-b border-slate-100 text-sm text-blue-600 flex items-center gap-2 transition-colors';
                        sdiv.innerHTML = `<svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>ค้นหา "<b>${sq}</b>"`;
                        sdiv.onclick = () => { input.value = sq; input.dispatchEvent(new Event('input')); };
                        box.appendChild(sdiv);
                    });
                } else {
                    box.innerHTML += `<div class="p-3 text-xs text-slate-400 text-center">ลองพิมพ์ชื่อ ตำบล อำเภอ หรือ จังหวัด แทนครับ</div>`;
                }
            }
        }

        function setupSearch() {
            const input = document.getElementById('mapSearch');
            const box   = document.getElementById('searchSuggestions');
            let timeout;
            input.addEventListener('input', function () {
                clearTimeout(timeout);
                const q = this.value.trim();
                if (q.length < 2) { box.classList.add('hidden'); return; }
                box.classList.remove('hidden');
                box.innerHTML = `<div class="p-3 text-center text-slate-500 text-sm flex items-center justify-center gap-2"><svg class="animate-spin h-4 w-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>กำลังค้นหา...</div>`;
                timeout = setTimeout(async () => {
                    try {
                        const res    = await fetch(`/map-search?q=${encodeURIComponent(q)}`);
                        const result = await res.json();
                        renderMapResults(result, input, box, latlng => {
                            map.flyTo(latlng, 16);
                            marker.setLatLng(latlng);
                            marker.setTooltipContent('📍 ตำแหน่งที่พัก (ลากได้)');
                        });
                    } catch (e) {
                        box.innerHTML = `<div class="p-3 text-center text-rose-500 text-sm">เกิดข้อผิดพลาดในการค้นหา กรุณาลองใหม่</div>`;
                    }
                }, 600);
            });
            document.addEventListener('click', e => {
                if (!input.contains(e.target) && !box.contains(e.target)) box.classList.add('hidden');
            });
        }

        async function renderProfiles() {
            const list = document.getElementById('profileList');
            list.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">กำลังโหลด...</div>`;
            try {
                const res = await fetch('/profiles');
                _allProfiles = await res.json();
                const q = document.getElementById('profileListSearch')?.value || '';
                renderProfileList(q);
            } catch(e) {
                list.innerHTML = `<div class="text-center py-6 text-rose-500 text-sm">โหลดโปรไฟล์ไม่สำเร็จ</div>`;
            }
        }

        function filterProfileList(q) {
            renderProfileList(q);
        }

        function renderProfileList(q) {
            const list = document.getElementById('profileList');
            const lower = (q || '').toLowerCase();
            const profiles = lower
                ? _allProfiles.filter(p =>
                    (p.profileName || '').toLowerCase().includes(lower) ||
                    (p.fullName || '').toLowerCase().includes(lower) ||
                    (p.position || '').toLowerCase().includes(lower))
                : _allProfiles;

            const countEl = document.getElementById('profileCount');
            if (countEl) {
                countEl.textContent = lower
                    ? `พบ ${profiles.length} จาก ${_allProfiles.length} โปรไฟล์`
                    : `ทั้งหมด ${_allProfiles.length} โปรไฟล์`;
            }

            list.innerHTML = '';
            if (!_allProfiles.length) {
                list.innerHTML = `
                    <div class="text-center py-8 text-slate-400">
                        <svg class="w-10 h-10 mx-auto mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <p class="text-sm">ยังไม่มีโปรไฟล์ที่บันทึกไว้</p>
                    </div>`;
                return;
            }
            if (!profiles.length) {
                list.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">ไม่พบโปรไฟล์ที่ตรงกับ "<b>${q}</b>"</div>`;
                return;
            }
            profiles.forEach(p => {
                const initial = (p.profileName || p.fullName || '?').replace(/[^฀-๿a-zA-Z]/g, '').charAt(0) || '?';
                const isEditing = editingId === p.id;
                const div = document.createElement('div');
                div.className = `flex items-center gap-3 border p-3 rounded-xl transition-colors ${isEditing ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-100 hover:bg-blue-50 hover:border-blue-100'}`;
                div.innerHTML = `
                    <div class="w-9 h-9 rounded-full ${isEditing ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'} flex items-center justify-center font-bold text-sm flex-shrink-0">${initial}</div>
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-slate-800 text-sm truncate">${p.profileName}${isEditing ? ' <span class="text-amber-600 font-normal text-xs">(กำลังแก้ไข)</span>' : ''}</div>
                        <div class="text-xs text-slate-500 truncate">${p.fullName}${p.position ? ' · ' + p.position : ''}</div>
                    </div>
                    <div class="flex gap-1 flex-shrink-0">
                        <button title="แก้ไข" class="btn-edit text-slate-300 hover:text-blue-500 transition-colors p-1.5 rounded-lg hover:bg-blue-50">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        </button>
                        <button title="ลบ" class="btn-del text-slate-300 hover:text-rose-500 transition-colors p-1.5 rounded-lg hover:bg-rose-50">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>`;
                div.querySelector('.btn-edit').onclick = () => editProfile(p);
                div.querySelector('.btn-del').onclick  = () => deleteProfile(p.id);
                list.appendChild(div);
            });
        }

        function editProfile(p) {
            editingId = p.id;
            document.getElementById('pName').value     = p.profileName || '';
            document.getElementById('pUser').value     = p.fullName    || '';
            document.getElementById('pPosition').value = p.position    || '';
            document.getElementById('pAffil').value    = p.affiliation || '';
            document.getElementById('pAddrNo').value   = p.no   || '';
            document.getElementById('pAddrSoi').value  = p.soi  || '';
            document.getElementById('pAddrRoad').value = p.road || '';
            document.getElementById('pAddrSub').value  = p.sub  || '';
            document.getElementById('pAddrDist').value = p.dist || '';
            document.getElementById('pAddrProv').value = p.prov || '';
            document.getElementById('pAddrZip').value  = p.zip  || '';
            if (p.lat && p.lng) { const ll = L.latLng(p.lat, p.lng); marker.setLatLng(ll); map.flyTo(ll, 15); }
            document.getElementById('formTitle').textContent = 'แก้ไขโปรไฟล์';
            document.getElementById('formIconBg').className  = 'w-7 h-7 bg-amber-500 rounded-lg flex items-center justify-center';
            document.getElementById('formIcon').setAttribute('d', 'M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z');
            document.getElementById('saveBtn').innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>อัปเดตโปรไฟล์`;
            document.getElementById('saveBtn').className = 'flex-1 bg-amber-500 text-white font-bold py-3 rounded-xl hover:bg-amber-600 active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-sm';
            document.getElementById('cancelBtn').classList.remove('hidden');
            document.getElementById('profileForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
            renderProfiles();
        }

        function cancelEdit() {
            editingId = null;
            document.querySelectorAll('#profileForm input[type="text"]').forEach(inp => { inp.value = ''; });
            document.getElementById('formTitle').textContent = 'เพิ่มโปรไฟล์ใหม่';
            document.getElementById('formIconBg').className  = 'w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center';
            document.getElementById('formIcon').setAttribute('d', 'M12 4v16m8-8H4');
            document.getElementById('saveBtn').innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>บันทึกโปรไฟล์`;
            document.getElementById('saveBtn').className = 'flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-sm';
            document.getElementById('cancelBtn').classList.add('hidden');
            renderProfiles();
        }

        async function saveProfile() {
            const pName = document.getElementById('pName').value.trim();
            const pUser = document.getElementById('pUser').value.trim();
            if (!pName || !pUser) return alert('กรุณาระบุชื่อโปรไฟล์ และ ชื่อผู้เดินทาง');
            const pos = marker.getLatLng();
            const profileData = {
                profileName: pName, fullName: pUser,
                position:    document.getElementById('pPosition').value.trim(),
                affiliation: document.getElementById('pAffil').value.trim(),
                no: document.getElementById('pAddrNo').value, soi: document.getElementById('pAddrSoi').value,
                road: document.getElementById('pAddrRoad').value, sub: document.getElementById('pAddrSub').value,
                dist: document.getElementById('pAddrDist').value, prov: document.getElementById('pAddrProv').value,
                zip: document.getElementById('pAddrZip').value, lat: pos.lat, lng: pos.lng,
            };
            try {
                const method = editingId ? 'PUT' : 'POST';
                const url    = editingId ? `/profiles/${editingId}` : '/profiles';
                const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(profileData) });
                if (!res.ok) throw new Error();
                cancelEdit();
            } catch(e) { alert('บันทึกไม่สำเร็จ กรุณาลองใหม่'); }
        }

        async function deleteProfile(id) {
            if (!confirm('ต้องการลบโปรไฟล์นี้ใช่หรือไม่?')) return;
            if (editingId === id) cancelEdit();
            try {
                await fetch(`/profiles/${id}`, { method: 'DELETE' });
                renderProfiles();
            } catch(e) { alert('ลบไม่สำเร็จ'); }
        }

        async function searchFromAddress() {
            const no   = document.getElementById('pAddrNo').value.trim();
            const soi  = document.getElementById('pAddrSoi').value.trim();
            const sub  = document.getElementById('pAddrSub').value.trim();
            const dist = document.getElementById('pAddrDist').value.trim();
            const prov = document.getElementById('pAddrProv').value.trim();
            const q = [no, soi, sub, dist, prov].filter(Boolean).join(' ');
            if (!q) return alert('กรุณากรอกที่อยู่ก่อน');
            const input = document.getElementById('mapSearch');
            const box   = document.getElementById('searchSuggestions');
            input.value = q;
            box.classList.remove('hidden');
            box.innerHTML = `<div class="p-3 text-center text-slate-500 text-sm flex items-center justify-center gap-2"><svg class="animate-spin h-4 w-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>กำลังค้นหาจากที่อยู่...</div>`;
            try {
                const res    = await fetch(`/map-search?q=${encodeURIComponent(q)}`);
                const result = await res.json();
                renderMapResults(result, input, box, latlng => {
                    map.flyTo(latlng, 16);
                    marker.setLatLng(latlng);
                });
                // auto-fly to first result
                if (result.data && result.data[0]?.lat && result.data[0]?.lon) {
                    map.flyTo(L.latLng(result.data[0].lat, result.data[0].lon), 15);
                    marker.setLatLng(L.latLng(result.data[0].lat, result.data[0].lon));
                }
            } catch(e) {
                box.innerHTML = `<div class="p-3 text-center text-rose-500 text-sm">เกิดข้อผิดพลาด</div>`;
            }
        }

        initProfileMap();
        setupSearch();
        renderProfiles();
    </script>
</body>
</html>
