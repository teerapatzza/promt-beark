<!DOCTYPE html>
<html lang="th">
<head>
    <script src="api-fetch.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขอบคุณที่ให้คะแนน — พร้อมเบิก</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #F1F4FA; color: #14213D; font-family: 'Sarabun', sans-serif; }
.hero {
    position: relative; overflow: hidden;
    background: linear-gradient(160deg, #031A52 0%, #0B2D7A 100%);
    padding: 40px 16px 150px; text-align: center;
}
.hero .ring { position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.09); pointer-events: none; }
.hero .dot { position: absolute; border-radius: 50%; pointer-events: none; }
.card {
    background: #fff; border: 1px solid #E1E7F2; border-radius: 28px;
    box-shadow: 0 1px 2px rgba(11,35,88,.05), 0 18px 44px rgba(11,35,88,.10);
    padding: 0 36px 36px; display: flex; flex-direction: column;
    align-items: center; gap: 20px; text-align: center;
}
.seal {
    margin-top: -48px; width: 96px; height: 96px; border-radius: 50%;
    background: linear-gradient(150deg, #E3AE45 0%, #CF952B 100%);
    border: 6px solid #fff; box-shadow: 0 10px 24px rgba(207,149,43,.40);
    display: flex; align-items: center; justify-content: center; color: #fff;
}
.btn {
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; font-family: 'Kanit', sans-serif;
    border-radius: 16px; transition: transform .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn.gold { background: #CF952B; color: #1B1300; font-size: 17px; font-weight: 600; padding: 16px 22px; box-shadow: 0 8px 18px rgba(207,149,43,.30); }
.btn.plain { background: #fff; color: #0B2358; font-size: 17px; font-weight: 500; padding: 14.5px 22px; border: 1.5px solid #B9C5DC; }
@media (max-width: 480px) { .card { padding: 0 22px 28px; } }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
</style>
</head>
<body>

<div class="hero">
    <span class="ring" style="left:-100px; top:-140px; width:380px; height:380px;"></span>
    <span class="ring" style="right:-80px; top:-90px; width:300px; height:300px;"></span>
    <span class="dot" style="left:22%; top:90px; width:12px; height:12px; background:#CF952B;"></span>
    <span class="dot" style="right:24%; top:56px; width:9px; height:9px; background:#FFD58A;"></span>
    <span class="dot" style="right:30%; top:130px; width:14px; height:14px; background:transparent; border:2px solid #9EC5FF;"></span>
    <span style="position:relative; font-size:15px; font-weight:600; letter-spacing:.04em; color:#B7D3FF;">แบบประเมินการใช้งานพร้อมเบิก</span>
</div>

<div style="width:100%; max-width:600px; margin:-88px auto 0; padding:0 16px 72px;">
    <div class="card">
        <span class="seal">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
        </span>

        <div style="display:flex; flex-direction:column; gap:10px;">
            <h1 id="h" style="margin:0; font-family:'Kanit',sans-serif; font-weight:600; font-size:32px; line-height:1.35; color:#031A52;">ขอบคุณมากค่ะ</h1>
            <p id="p" style="margin:0; font-size:17px; line-height:1.8; color:#4A5670;">เราได้รับความเห็นของท่านแล้ว<br>ทีมงานอ่านทุกข้อความ และจะทยอยปรับให้ใช้ง่ายขึ้น</p>
        </div>

        <div style="width:100%; background:#EAF6EF; border:1px solid #BFE3CC; border-radius:16px; padding:14px 18px; display:flex; align-items:center; gap:12px; text-align:left;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14663A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <span style="font-size:14.5px; line-height:1.7; color:#14573A;">คำตอบถูกบันทึกแบบ<b>ไม่ระบุชื่อ</b> ไม่มีใครรู้ว่าเป็นของท่าน</span>
        </div>

        <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center; width:100%;">
            <a href="index.html" class="btn gold" style="flex:1 1 200px;">กลับหน้าแรก</a>
            <a href="feedback.html" class="btn plain" style="flex:1 1 200px;">แก้คำตอบ</a>
        </div>

        <p style="margin:0; font-size:13.5px; color:#5A667B; line-height:1.7;">กลับมาแก้ได้จากเครื่องนี้ตลอดเวลาที่ยังเปิดรับอยู่</p>
    </div>
</div>

<script>
// บอกให้ตรงว่าเพิ่งส่งครั้งแรก หรือเพิ่งแก้ของเดิม
if (new URLSearchParams(location.search).get('updated') === '1') {
    document.getElementById('h').textContent = 'บันทึกคำตอบใหม่แล้วค่ะ';
    document.getElementById('p').innerHTML = 'คำตอบเดิมของท่านถูกแทนที่เรียบร้อย<br>ขอบคุณที่สละเวลากลับมาแก้ให้ตรงขึ้น';
}
</script>
<script src="auth-guard.js"></script>
</body>
</html>
