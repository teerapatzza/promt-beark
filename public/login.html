<!DOCTYPE html>
<html lang="th">
<head>
    <script src="api-fetch.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — พร้อมเบิก</title>

  <!-- Google Fonts - Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-light: #f8f9fa;
      --bg-secondary: #e9ecef;
      --card-white: #ffffff;
      --border-light: #dee2e6;
      /* หมายเหตุ: ชื่อตัวแปรยังเป็น gold ตามของเดิม แต่ค่าเปลี่ยนเป็นน้ำเงินแล้ว
               เพื่อให้ทุกหน้าใช้สีเดียวกัน (แก้ 26 ส.ค. 2569) */
            --gold: #3B82F6;
      --gold-light: #2563EB;
      --blue: #3B82F6;
      --blue-dark: #2563EB;
      --text-dark: #1f2937;
      --text-muted: #6b7280;
      --success: #10B981;
      --error: #EF4444;
    }

    body {
      font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans', sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #dbeafe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dark);
      position: relative;
      overflow: auto;
      padding: 20px 0;
    }

    /* Animated background particles */
    body::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
      animation: float 20s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-50px, -50px); }
    }

    .card {
      background: var(--card-white);
      border-radius: 24px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.08),
        0 0 0 1px var(--border-light);
      width: 100%;
      max-width: 460px;
      padding: 48px 40px;
      position: relative;
      z-index: 1;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--blue) 100%);
      border-radius: 24px 24px 0 0;
    }

    .logo {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
    }

    .logo-icon svg {
      width: 36px;
      height: 36px;
      color: var(--bg-dark);
    }

    .logo h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .logo p {
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 400;
    }

    .version {
      display: inline-block;
      background: rgba(59, 130, 246, 0.1);
      color: var(--gold);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 8px;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .tabs {
      display: flex;
      background: var(--bg-light);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 32px;
      border: 1px solid var(--border-light);
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9375rem;
      color: var(--text-muted);
      border-radius: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .tab:not(.active):hover {
      color: var(--text-dark);
      background: rgba(59, 130, 246, 0.1);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label svg {
      width: 16px;
      height: 16px;
      color: var(--gold);
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: white;
      border: 1.5px solid var(--border-light);
      border-radius: 12px;
      font-size: 0.9375rem;
      color: var(--text-dark);
      outline: none;
      transition: all 0.3s;
      font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans', sans-serif;
    }

    input::placeholder {
      color: var(--text-muted);
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      width: 20px;
      height: 20px;
    }

    .alert {
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 0.875rem;
      display: none;
      border: 1px solid;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.1);
      color: var(--error);
      border-color: rgba(239, 68, 68, 0.3);
      display: block;
    }

    .alert.success {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.3);
      display: block;
    }

    .footer {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border-light);
      color: var(--text-muted);
      font-size: 0.8125rem;
    }

    .footer a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    #formLogin, #formRegister { display: none; }
    #formLogin.active, #formRegister.active { display: block; }

    @media (max-width: 480px) {
      .card {
        padding: 32px 24px;
        border-radius: 16px;
      }

      .logo h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Logo -->
    <div class="logo">
      <!-- โลโก้แอปจริง มีคำว่า "พร้อมเบิก" อยู่ในรูปแล้ว จึงซ่อนหัวข้อข้างล่างไม่ให้ซ้ำ
           ถ้าไฟล์หาย ถอยไปใช้ไอคอนเดิม + หัวข้อตัวหนังสือ ไม่ทิ้งช่องว่าง -->
      <img id="appLogo" src="app-logo.png" alt="พร้อมเบิก"
           style="width:104px;height:104px;object-fit:contain;display:block;margin:0 auto 6px"
           onload="document.getElementById('appTitle').style.display='none'"
           onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex'">
      <div class="logo-icon" id="logoFallback" style="display:none">
        <!-- Document + Dollar Icon (Invoice/Receipt) -->
        <svg fill="currentColor" viewBox="0 0 24 24">
          <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6zm5-1h2v-1.5h1c.55 0 1-.45 1-1v-3c0-.55-.45-1-1-1h-3v-1h4V10h-2V8.5h-2V10h-1c-.55 0-1 .45-1 1v3c0 .55.45 1 1 1h3v1H9v1.5h2V19z"/>
        </svg>
      </div>
      <h1 id="appTitle">พร้อมเบิก</h1>
      <p>Promberk · ระบบเบิกค่าใช้จ่ายการเดินทาง</p>
      <!-- เลขเวอร์ชันจริงมาจาก version.json ที่สร้างตอน build ไม่ใช่เลขที่พิมพ์ค้างไว้ -->
      <div class="version" id="versionBadge">…</div>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="authTabs">
      <div class="tab active" onclick="switchTab('login')">เข้าสู่ระบบ</div>
      <div class="tab" id="tabRegister" onclick="switchTab('register')">สมัครสมาชิก</div>
    </div>

    <!-- เข้าสู่ระบบด้วยบัญชีองค์กร — แสดงเมื่อตั้งค่า Microsoft 365 แล้วเท่านั้น -->
    <div id="msLoginBox" style="display:none">
      <div id="msAlert" class="alert"></div>
      <button type="button" id="msLoginBtn" onclick="loginWithMicrosoft()"
        style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
               padding:13px 16px;border:1.5px solid #d1d5db;border-radius:10px;background:#fff;
               color:#1f2937;font-size:.95rem;font-weight:600;cursor:pointer;
               font-family:inherit;transition:background .15s,border-color .15s"
        onmouseover="this.style.background='#f9fafb';this.style.borderColor='#9ca3af'"
        onmouseout="this.style.background='#fff';this.style.borderColor='#d1d5db'">
        <svg width="18" height="18" viewBox="0 0 23 23" aria-hidden="true">
          <rect x="1"  y="1"  width="10" height="10" fill="#f25022"/>
          <rect x="12" y="1"  width="10" height="10" fill="#7fba00"/>
          <rect x="1"  y="12" width="10" height="10" fill="#00a4ef"/>
          <rect x="12" y="12" width="10" height="10" fill="#ffb900"/>
        </svg>
        เข้าสู่ระบบด้วย Microsoft 365
      </button>
      <p style="text-align:center;color:#6b7280;font-size:.8rem;margin:10px 0 0">
        ใช้บัญชีอีเมลขององค์กร (@ha.or.th)<br>
        <a href="#" onclick="loginWithMicrosoft(true);return false"
           style="color:#2563eb;text-decoration:none;font-size:.78rem">เข้าด้วยบัญชีอื่น</a>
      </p>
      <!-- ทางเข้าสำรองของผู้ดูแลระบบ ซ่อนไว้จนกว่าจะกด -->
      <div id="adminDoor" style="text-align:center;margin-top:22px">
        <a href="#" onclick="showAdminLogin();return false"
           style="color:#9ca3af;text-decoration:none;font-size:.75rem">ผู้ดูแลระบบเข้าสู่ระบบด้วยรหัสผ่าน</a>
      </div>

      <div id="msDivider" style="display:none;align-items:center;gap:12px;margin:20px 0 4px">
        <span style="flex:1;height:1px;background:#e5e7eb"></span>
        <span style="color:#9ca3af;font-size:.78rem">สำหรับผู้ดูแลระบบเท่านั้น</span>
        <span style="flex:1;height:1px;background:#e5e7eb"></span>
      </div>
    </div>

    <!-- Login Form -->
    <form id="formLogin" class="active" onsubmit="handleLogin(event)">
      <div id="loginAlert" class="alert"></div>

      <div class="form-group">
        <label>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
          </svg>
          อีเมล
        </label>
        <input type="email" id="loginEmail" placeholder="your@email.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          รหัสผ่าน
        </label>
        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
        </svg>
        เข้าสู่ระบบ
      </button>
    </form>

    <!-- Register Form -->
    <form id="formRegister" onsubmit="handleRegister(event)">
      <div id="registerAlert" class="alert"></div>

      <div class="form-group">
        <label>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
          </svg>
          อีเมล
        </label>
        <input type="email" id="regEmail" placeholder="your@email.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          รหัสผ่าน
        </label>
        <input type="password" id="regPassword" placeholder="••••••••" required autocomplete="new-password">
      </div>

      <div class="form-group">
        <label>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          ยืนยันรหัสผ่าน
        </label>
        <input type="password" id="regPasswordConfirm" placeholder="••••••••" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
        </svg>
        สมัครสมาชิก
      </button>
    </form>

    <!-- Footer -->
    <div class="footer">
      <p>สำหรับ <strong>สถาบันพัฒนาและรับรองคุณภาพโรงพยาบาล</strong></p>
      <p style="margin-top: 8px;">Powered by <a href="#">Promberk v2.0.0</a></p>
    </div>
  </div>

  <script>
    /* ── เข้าสู่ระบบด้วย Microsoft 365 ──────────────────────────────
       ถามเซิร์ฟเวอร์ก่อนว่าเปิดใช้หรือยัง แล้วค่อยจัดหน้าให้ตรงกับความจริง
       ยังไม่ตั้งค่า -> หน้านี้ทำงานเหมือนเดิมทุกอย่าง                      */
    let __authCfg = { microsoftEnabled: false, passwordLoginFor: 'all', selfRegisterAllowed: true, canonicalOrigin: '' };

    async function initAuthOptions() {
      let cfg = __authCfg;
      try {
        const r = await fetch('/auth/config');
        if (r.ok) { cfg = await r.json(); __authCfg = cfg; }
      } catch (_) { /* ต่อเซิร์ฟเวอร์ไม่ได้ — ใช้ค่าเดิมไปก่อน */ }

      // ลำดับสำคัญ: จัดการแท็บให้เสร็จก่อน เพราะ switchTab() จะใส่ active
      // กลับเข้า formLogin ถ้าเรียกทีหลังจะไปลบล้างการซ่อนฟอร์มด้านล่าง
      if (!cfg.selfRegisterAllowed) {
        // ปิดสมัครเองแล้วเหลือแท็บเดียว — ซ่อนแถบแท็บทั้งแถบ
        // ไม่งั้นแท็บที่เหลือจะยืดเต็มความกว้างจนดูเหมือนปุ่ม แล้วชนกับปุ่มจริงด้านล่าง
        switchTab('login');
        const tabs = document.getElementById('authTabs');
        if (tabs) tabs.style.display = 'none';
      }

      if (cfg.microsoftEnabled) {
        document.getElementById('msLoginBox').style.display = 'block';
        // เข้าผ่าน Microsoft อย่างเดียว — ซ่อนช่องอีเมล/รหัสผ่านออกจากสายตา
        // แต่ไม่ตัดทิ้ง เพราะถ้า Entra ล่มหรือ client secret หมดอายุ
        // นี่คือทางเดียวที่จะเข้าระบบได้โดยไม่ต้อง SSH เข้าฐานข้อมูล
        document.getElementById('formLogin').classList.remove('active');
        document.getElementById('loginEmail').placeholder = 'อีเมลผู้ดูแลระบบ';
      }

      // กลับมาจาก Microsoft สำเร็จ: #ms=<token> -> เก็บลง localStorage แล้วเข้าระบบ
      const m = /^#ms=(.+)$/.exec(location.hash || '');
      if (m) {
        try { localStorage.setItem('token', decodeURIComponent(m[1])); } catch (_) {}
        history.replaceState(null, '', location.pathname);
        location.replace('index.html');
        return;
      }

      // กลับมาจาก Microsoft ไม่สำเร็จ: ?error=...
      const err = new URLSearchParams(location.search).get('error');
      if (err) {
        const box = document.getElementById('msAlert') || document.getElementById('loginAlert');
        box.textContent = err;
        box.className = 'alert error';
        box.style.display = 'block';
      }
    }

    /** เปิดช่องอีเมล/รหัสผ่านสำหรับผู้ดูแลระบบ (ปกติซ่อนไว้) */
    function showAdminLogin() {
      document.getElementById('adminDoor').style.display = 'none';
      document.getElementById('msDivider').style.display = 'flex';
      document.getElementById('formLogin').classList.add('active');
      document.getElementById('loginEmail').focus();
    }

    /** @param {boolean} pickAccount ให้ Microsoft ถามว่าจะใช้บัญชีไหน แทนที่จะเข้าด้วยบัญชีที่ค้างอยู่ */
    function loginWithMicrosoft(pickAccount) {
      const btn = document.getElementById('msLoginBtn');
      btn.disabled = true;
      btn.style.opacity = '.6';
      btn.textContent = 'กำลังพาไปหน้า Microsoft…';

      const qs = pickAccount ? '?prompt=select_account' : '';

      // ต้องเริ่มขั้นตอนที่โดเมนหลักเสมอ ไม่งั้นคุกกี้ state จะไม่ถูกส่งกลับมา
      // ตอน Microsoft redirect กลับ แล้วจะล็อกอินไม่ผ่าน
      //
      // เข้ามาผิดโดเมน (เช่นเข้าด้วยเลข IP) ก็ให้ข้ามไปเริ่มที่โดเมนหลักเลย
      // เดิมส่งกลับไปหน้า login เฉย ๆ ซึ่งหน้าตาเหมือนกันทุกอย่าง
      // ผู้ใช้เลยเห็นเป็น "กดแล้วเด้งกลับที่เดิม" และต้องกดซ้ำโดยไม่รู้ตัว
      const want = __authCfg && __authCfg.canonicalOrigin;
      const base = (want && want !== location.origin) ? want : '';

      // ต้องเป็นการเปลี่ยนหน้าจริง ไม่ใช่ fetch — Microsoft ต้องแสดงหน้าล็อกอินของเขาเอง
      location.href = base ? (base + '/auth/microsoft' + qs)
                           : ('auth/microsoft' + qs);
    }

    /* ป้ายเวอร์ชัน — ค่าจริงมาจาก version.json ที่สร้างตอน build image
       บอกได้ทันทีว่ากำลังเปิด UAT หรือระบบจริง และเวอร์ชันตรงกันไหม */
    function showVersion() {
      fetch('version.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (v) {
          var el = document.getElementById('versionBadge');
          if (!el) return;
          if (!v) { el.style.display = 'none'; return; }
          var isProd = String(v.env).toUpperCase() === 'PROD';
          el.textContent = (isProd ? '' : 'UAT · ') + 'v' + v.version;
          el.title = 'ระบบ ' + v.env + '  ·  สร้างเมื่อ ' + (v.builtAt || '-');
          if (!isProd) {
            el.style.background = '#fef3c7';
            el.style.color = '#92400e';
            el.style.border = '1px solid #fbbf24';
          }
        })
        .catch(function () {
          var el = document.getElementById('versionBadge');
          if (el) el.style.display = 'none';
        });
    }

    if (document.readyState === 'loading')
      document.addEventListener('DOMContentLoaded', function () { initAuthOptions(); showVersion(); });
    else { initAuthOptions(); showVersion(); }

    // Tab switching
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('form').forEach(f => f.classList.remove('active'));

      if (tab === 'login') {
        document.querySelector('.tab:first-child').classList.add('active');
        document.getElementById('formLogin').classList.add('active');
      } else {
        document.querySelector('.tab:last-child').classList.add('active');
        document.getElementById('formRegister').classList.add('active');
      }
    }

    // Handle Login
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const alert = document.getElementById('loginAlert');

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          console.log('✅ Login Success:', data);
          if (data.token) {
            localStorage.setItem('token', data.token);
            console.log('💾 Token saved to localStorage');
          }
          alert.className = 'alert success';
          alert.textContent = '✓ เข้าสู่ระบบสำเร็จ กำลังเปลี่ยนหน้า...';
          setTimeout(() => {
            window.location.replace('index.html');
          }, 800);
        } else {
          alert.className = 'alert error';
          alert.textContent = '✗ ' + (data.error || data.message || 'เข้าสู่ระบบไม่สำเร็จ');
        }
      } catch (err) {
        alert.className = 'alert error';
        alert.textContent = '✗ เกิดข้อผิดพลาดในการเชื่อมต่อ';
      }
    }

    // Handle Register
    async function handleRegister(e) {
      e.preventDefault();
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const passwordConfirm = document.getElementById('regPasswordConfirm').value;
      const alert = document.getElementById('registerAlert');

      if (password !== passwordConfirm) {
        alert.className = 'alert error';
        alert.textContent = '✗ รหัสผ่านไม่ตรงกัน';
        return;
      }

      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          if (data.token) {
            localStorage.setItem('token', data.token);
          }
          alert.className = 'alert success';
          alert.textContent = '✓ สมัครสมาชิกสำเร็จ กำลังเข้าสู่ระบบ...';
          setTimeout(() => {
            window.location.replace('index.html');
          }, 800);
        } else {
          alert.className = 'alert error';
          alert.textContent = '✗ ' + (data.error || data.message || 'สมัครสมาชิกไม่สำเร็จ');
        }
      } catch (err) {
        alert.className = 'alert error';
        alert.textContent = '✗ เกิดข้อผิดพลาดในการเชื่อมต่อ';
      }
    }

    // ถูกพากลับมาเพราะเซสชันหมดอายุ — ต้องบอกเหตุผล ไม่ใช่เด้งมาเฉยๆ
    (function () {
      if (new URLSearchParams(location.search).get('reason') !== 'expired') return;
      const a = document.getElementById('loginAlert');
      if (!a) return;
      a.className = 'alert error';
      a.textContent = '⚠ เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่';
    })();
  </script>
</body>
</html>
